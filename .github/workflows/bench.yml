name: bench
# Tier 3 of the pipeline (issue 35): the acceptance benchmarks, measured and
# never blocking a pull request. Every benchmark runs RUNS times in release
# with RICK_BENCH_RECORD set (a run over its target is recorded, not
# failed); the job summary gets the runner's hardware line and, per
# benchmark, the target, the median and the worst run, and the raw logs,
# the hardware line and the summary are the job's artifact. The summary
# marks every benchmark whose median is over its target and counts them in
# a line above the table (issue 277); the run stays green, so the mark is
# where a number past its target shows. One that gets slower and stays
# under its target shows only by comparing runs. BENCHMARKS.md is written
# from the summary of a manual run; the targets in
# crates/tests/src/bench.rs follow from it.
#
# It runs in full, every benchmark on Linux, macOS and Windows, when it is
# started by hand from the Actions tab. There is no scheduled run (decided
# on pull request 290). Before a release it is started on the release
# commit and its summary is read before the `v*` tag is pushed (CLAUDE.md,
# "How to work"); nothing checks that this was done. A `v*` tag starts it
# once more, on the commit that was tagged. A run started by hand records
# its summary on the benchmark-history branch when asked.
#
# Runners: the labels come from the repository variables RUNNER_LINUX_X64,
# RUNNER_LINUX_ARM64, RUNNER_MACOS and RUNNER_WINDOWS; where one is not
# set, the job runs on GitHub's runner of that platform.
on:
  workflow_dispatch:
    inputs:
      runs:
        description: "Runs per benchmark"
        default: "5"
        required: true
      history:
        description: "Record the summary on the benchmark-history branch"
        type: boolean
        default: false
  push:
    tags: ["v*"]
concurrency:
  group: bench-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  RUNS: ${{ inputs.runs || '5' }}
jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-24.04", "macos-latest", "windows-latest"]
    # `os` names the platform, and the steps read it; the label the job
    # runs on is the platform's variable or GitHub's runner.
    runs-on: ${{ matrix.os == 'ubuntu-24.04' && (vars.RUNNER_LINUX_X64 || 'ubuntu-24.04') || matrix.os == 'macos-latest' && (vars.RUNNER_MACOS || 'macos-latest') || (vars.RUNNER_WINDOWS || 'windows-latest') }}
    timeout-minutes: 90
    permissions:
      # The summary goes to the benchmark-history branch.
      contents: write
    env:
      # Measure only: a run over a target is recorded, not failed.
      RICK_BENCH_RECORD: "1"
      # Issue 18: media playback is built where GStreamer's development
      # files are (Linux); the office and media timings run there only.
      RICK_TESTS_FEATURES: ${{ matrix.os == 'ubuntu-24.04' && '--features gstreamer' || '' }}
    steps:
      - uses: actions/checkout@v4
      # No 7-Zip library here: the benchmarks measure no disk image.
      - uses: ./.github/actions/setup
        with: { system: test, sevenzip: "false" }
      # The hardware line, as the runner reports it: GitHub's image name and
      # version, then the CPU, core count and memory the OS sees.
      - name: hardware
        shell: bash
        run: |
          {
            echo "### ${{ runner.os }} ${{ runner.arch }} (${{ matrix.os }})"
            echo
            echo "- Runner image: $ImageOS $ImageVersion"
            case "${{ runner.os }}" in
              Linux)
                echo "- CPU: $(lscpu | sed -n 's/^Model name: *//p' | head -1), $(nproc) vCPU"
                echo "- Memory: $(free -g | awk '/^Mem:/ {print $2}') GB" ;;
              macOS)
                echo "- CPU: $(sysctl -n machdep.cpu.brand_string), $(sysctl -n hw.ncpu) vCPU"
                echo "- Memory: $(( $(sysctl -n hw.memsize) / 1024 / 1024 / 1024 )) GB" ;;
              Windows)
                echo "- CPU: $(powershell -NoProfile -Command '(Get-CimInstance Win32_Processor).Name'), $NUMBER_OF_PROCESSORS vCPU"
                echo "- Memory: $(powershell -NoProfile -Command '[math]::Round((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB)') GB" ;;
            esac
            echo "- Commit: $(git rev-parse --short HEAD), $RUNS runs per benchmark"
            echo
          } | tee -a "$GITHUB_STEP_SUMMARY" hardware.md
      - name: build
        run: cargo test -p tests --release ${{ env.RICK_TESTS_FEATURES }} --no-run
      - name: measure
        shell: bash
        # The fixtures on the runner's temp disk, as full.yml puts them.
        # Every ignored test of the one test binary is a timing but two,
        # which are skipped: the search walk cancelled by a new text and
        # the throttled progress events, both full.yml's. Every timing is
        # an ignored test, and none is run by name (issue 277).
        env: { TMP: "${{ runner.temp }}", TEMP: "${{ runner.temp }}", TMPDIR: "${{ runner.temp }}" }
        run: |
          set -o pipefail
          for i in $(seq 1 "$RUNS"); do
            echo "::group::run $i"
            cargo test -p tests --release ${{ env.RICK_TESTS_FEATURES }} --test main -- --ignored --nocapture --test-threads 1 --skip a_new_text_cancels_the_running_walk --skip progress_over_the_200k_fixture 2>&1 | tee "bench-$i.log"
            echo "::endgroup::"
          done
      - name: summary
        shell: bash
        run: python3 .github/scripts/bench-summary.py "bench-*.log" | tee -a "$GITHUB_STEP_SUMMARY" summary.md
      - uses: actions/upload-artifact@v4
        with:
          name: bench-${{ runner.os }}
          path: |
            bench-*.log
            hardware.md
            summary.md
          retention-days: 90
      - name: record on the benchmark-history branch
        if: inputs.history
        shell: bash
        run: .github/scripts/bench-history.sh summary.md hardware.md "$(echo "$RUNNER_OS-$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')"
