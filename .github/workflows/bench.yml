name: bench
# Measures every acceptance benchmark five times in release on the three
# runners and summarises the median and the worst run per benchmark, with
# the runner's hardware line. BENCHMARKS.md is written from this summary;
# the targets in crates/tests/src/bench.rs follow from it. Run by hand.
on:
  workflow_dispatch:
    inputs:
      runs:
        description: "Runs per benchmark"
        default: "5"
        required: true
jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      # Measure only: a run over a target is recorded, not failed.
      RICK_BENCH_RECORD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: pdfium
        shell: bash
        run: |
          case "${{ runner.os }}-${{ runner.arch }}" in
            Linux-X64) asset=pdfium-linux-x64 ;;
            Linux-ARM64) asset=pdfium-linux-arm64 ;;
            macOS-ARM64) asset=pdfium-mac-arm64 ;;
            macOS-X64) asset=pdfium-mac-x64 ;;
            Windows-X64) asset=pdfium-win-x64 ;;
            *) echo "no pdfium build for ${{ runner.os }}-${{ runner.arch }}"; exit 1 ;;
          esac
          dest="$RUNNER_TEMP/pdfium"
          if [ "${{ runner.os }}" = "Windows" ]; then
            dest="$(cygpath -u "$RUNNER_TEMP")/pdfium"
          fi
          mkdir -p "$dest"
          curl -sSL "https://github.com/bblanchon/pdfium-binaries/releases/latest/download/$asset.tgz" | tar xz -C "$dest"
          if [ "${{ runner.os }}" = "Windows" ]; then
            echo "RICK_PDFIUM_DIR=$(cygpath -w "$dest/bin")" >> "$GITHUB_ENV"
          else
            echo "RICK_PDFIUM_DIR=$dest/lib" >> "$GITHUB_ENV"
          fi
          echo "RICK_REQUIRE_PDFIUM=1" >> "$GITHUB_ENV"
      # The hardware line, as the runner reports it: GitHub's image name and
      # version, then the CPU, core count and memory the OS sees.
      - name: hardware
        shell: bash
        run: |
          {
            echo "### ${{ runner.os }} ${{ runner.arch }} (${{ matrix.os }})"
            echo
            echo "- Runner image: $ImageOS $ImageVersion"
            case "${{ runner.os }}" in
              Linux)
                echo "- CPU: $(lscpu | sed -n 's/^Model name: *//p' | head -1), $(nproc) vCPU"
                echo "- Memory: $(free -g | awk '/^Mem:/ {print $2}') GB" ;;
              macOS)
                echo "- CPU: $(sysctl -n machdep.cpu.brand_string), $(sysctl -n hw.ncpu) vCPU"
                echo "- Memory: $(( $(sysctl -n hw.memsize) / 1024 / 1024 / 1024 )) GB" ;;
              Windows)
                echo "- CPU: $(powershell -NoProfile -Command '(Get-CimInstance Win32_Processor).Name'), $NUMBER_OF_PROCESSORS vCPU"
                echo "- Memory: $(powershell -NoProfile -Command '[math]::Round((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB)') GB" ;;
            esac
            echo
          } | tee -a "$GITHUB_STEP_SUMMARY" hardware.md
      - name: build
        run: cargo test -p tests --release --no-run
      - name: measure
        shell: bash
        # The fixtures on the runner's temp disk, as ci.yml puts them. The
        # one ignored close-out test that is not a timing (the search walk
        # cancelled by a new text) is skipped: it is not measured here.
        env: { TMP: "${{ runner.temp }}", TEMP: "${{ runner.temp }}", TMPDIR: "${{ runner.temp }}" }
        run: |
          set -o pipefail
          for i in $(seq 1 "${{ inputs.runs }}"); do
            echo "::group::run $i"
            cargo test -p tests --release --test fixture --test listing --test copy --test ui --test preview --test git --test chrome --test preview_pane --test viewer --test startup --test plugins --test closeout -- --ignored --nocapture --test-threads 1 --skip a_new_text_cancels_the_running_walk 2>&1 | tee "bench-$i.log"
            cargo test -p tests --release --test session -- --nocapture --test-threads 1 a_big_session_starts 2>&1 | tee -a "bench-$i.log"
            echo "::endgroup::"
          done
      - name: summary
        shell: bash
        run: python3 .github/scripts/bench-summary.py "bench-*.log" | tee -a "$GITHUB_STEP_SUMMARY" summary.md
      - uses: actions/upload-artifact@v4
        with:
          name: bench-${{ runner.os }}
          path: |
            bench-*.log
            hardware.md
            summary.md
