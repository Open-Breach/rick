name: bench
# Tier 3 of the pipeline (issue 35): the acceptance benchmarks, measured and
# never blocking a pull request. Every benchmark runs RUNS times in release
# with RICK_BENCH_RECORD set (a run over its target is recorded, not
# failed); the job summary gets the runner's hardware line and the median
# and the worst run per benchmark, and the raw logs, the hardware line and
# the summary are the job's artifact. BENCHMARKS.md is written from the
# summary of a manual run; the targets in crates/tests/src/bench.rs follow
# from it.
#
# By hand from the Actions tab and on a `v*` tag: the three runners.
# Nightly: Linux x64 on dev, the summary committed to the benchmark-history
# branch, so a regression can be traced to a day range (a schedule runs
# from main's copy of this file and checks dev out). A manual run records
# there too when asked.
on:
  workflow_dispatch:
    inputs:
      runs:
        description: "Runs per benchmark"
        default: "5"
        required: true
      history:
        description: "Record the summary on the benchmark-history branch, as the nightly run does"
        type: boolean
        default: false
  push:
    tags: ["v*"]
  schedule:
    - cron: "41 3 * * *"
concurrency:
  group: bench-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  RUNS: ${{ inputs.runs || '5' }}
jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'schedule' && fromJSON('["ubuntu-24.04"]') || fromJSON('["ubuntu-24.04", "macos-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      # The summary goes to the benchmark-history branch.
      contents: write
    env:
      # Measure only: a run over a target is recorded, not failed.
      RICK_BENCH_RECORD: "1"
      # Issue 18: media playback is built where GStreamer's development
      # files are (Linux); the office and media timings run there only.
      RICK_TESTS_FEATURES: ${{ matrix.os == 'ubuntu-24.04' && '--features gstreamer' || '' }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event_name == 'schedule' && 'dev' || '' }}" }
      # No 7-Zip library here: the benchmarks measure no disk image.
      - uses: ./.github/actions/setup
        with: { system: test, sevenzip: "false" }
      # The hardware line, as the runner reports it: GitHub's image name and
      # version, then the CPU, core count and memory the OS sees.
      - name: hardware
        shell: bash
        run: |
          {
            echo "### ${{ runner.os }} ${{ runner.arch }} (${{ matrix.os }})"
            echo
            echo "- Runner image: $ImageOS $ImageVersion"
            case "${{ runner.os }}" in
              Linux)
                echo "- CPU: $(lscpu | sed -n 's/^Model name: *//p' | head -1), $(nproc) vCPU"
                echo "- Memory: $(free -g | awk '/^Mem:/ {print $2}') GB" ;;
              macOS)
                echo "- CPU: $(sysctl -n machdep.cpu.brand_string), $(sysctl -n hw.ncpu) vCPU"
                echo "- Memory: $(( $(sysctl -n hw.memsize) / 1024 / 1024 / 1024 )) GB" ;;
              Windows)
                echo "- CPU: $(powershell -NoProfile -Command '(Get-CimInstance Win32_Processor).Name'), $NUMBER_OF_PROCESSORS vCPU"
                echo "- Memory: $(powershell -NoProfile -Command '[math]::Round((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB)') GB" ;;
            esac
            echo "- Commit: $(git rev-parse --short HEAD), $RUNS runs per benchmark"
            echo
          } | tee -a "$GITHUB_STEP_SUMMARY" hardware.md
      - name: build
        run: cargo test -p tests --release ${{ env.RICK_TESTS_FEATURES }} --no-run
      - name: measure
        shell: bash
        # The fixtures on the runner's temp disk, as full.yml puts them. The
        # one ignored close-out test that is not a timing (the search walk
        # cancelled by a new text) is skipped: full.yml runs it.
        env: { TMP: "${{ runner.temp }}", TEMP: "${{ runner.temp }}", TMPDIR: "${{ runner.temp }}" }
        run: |
          set -o pipefail
          for i in $(seq 1 "$RUNS"); do
            echo "::group::run $i"
            cargo test -p tests --release ${{ env.RICK_TESTS_FEATURES }} --test fixture --test listing --test copy --test ui --test preview --test git --test chrome --test preview_pane --test startup --test plugins --test providers --test closeout --test previewers --test preview_3d -- --ignored --nocapture --test-threads 1 --skip a_new_text_cancels_the_running_walk 2>&1 | tee "bench-$i.log"
            cargo test -p tests --release ${{ env.RICK_TESTS_FEATURES }} --test session -- --nocapture --test-threads 1 a_big_session_starts 2>&1 | tee -a "bench-$i.log"
            echo "::endgroup::"
          done
      - name: summary
        shell: bash
        run: python3 .github/scripts/bench-summary.py "bench-*.log" | tee -a "$GITHUB_STEP_SUMMARY" summary.md
      - uses: actions/upload-artifact@v4
        with:
          name: bench-${{ runner.os }}
          path: |
            bench-*.log
            hardware.md
            summary.md
          retention-days: 90
      - name: record on the benchmark-history branch
        if: github.event_name == 'schedule' || inputs.history
        shell: bash
        run: .github/scripts/bench-history.sh summary.md hardware.md "$(echo "$RUNNER_OS-$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')"
