name: ci
# Tier 1 of the pipeline (issue 35): the fast checks of a pull request into
# dev, on Linux x64 only, in a few minutes. fmt first, then side by side
# clippy with the docs, the tests in debug, and the bundle of the binary
# with every plugin loading; cargo deny beside them. The pull request from
# dev into main runs the full matrix (full.yml); the benchmarks are
# bench.yml and never block a pull request.
#
# A new push cancels the branch's running check. A change to documentation
# only (Markdown, docs/) builds nothing: the `changes` job says so, the
# other jobs are skipped, and `tier 1`, the one check to require, still
# reports success.
#
# Runners: the labels come from the repository variables RUNNER_LINUX_X64,
# RUNNER_LINUX_ARM64, RUNNER_MACOS and RUNNER_WINDOWS; where one is not
# set, the job runs on GitHub's runner of that platform.
on:
  pull_request:
    branches: [dev]
  # Each merge into dev: the check after the fact, and the cache the pull
  # requests into dev restore from.
  push:
    branches: [dev]
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  # Issue 18: the media previewer's playback is built against the system
  # GStreamer on Linux. The kernel dylibs are built once per feature set,
  # so every cargo command carries the same features (QUESTIONS.md 81).
  RICK_WS_FEATURES: --features ext-preview-media/gstreamer,tests/gstreamer
jobs:
  changes:
    runs-on: ${{ vars.RUNNER_LINUX_X64 || 'ubuntu-24.04' }}
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        run: .github/scripts/docs-only.sh
        env:
          GH_TOKEN: ${{ github.token }}
  fmt:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ vars.RUNNER_LINUX_X64 || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with: { components: rustfmt }
      - run: cargo fmt --check
      # No Unicode symbol character is used as an icon (SPEC.md "Icons").
      - run: "! grep -rnP '(*UTF8)[\\x{2190}-\\x{2BFF}\\x{1F300}-\\x{1FAFF}]' crates/ui-egui/src"
      # Every text the UI shows goes through the t! lookup (issue 24): a
      # string literal handed to a widget outside t! fails here.
      - run: .github/scripts/check-strings.py
  deny:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ vars.RUNNER_LINUX_X64 || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
  # The three builds run side by side once fmt has passed, each from its own
  # cache; the whole tier takes as long as the slowest of them.
  clippy:
    needs: [changes, fmt]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ vars.RUNNER_LINUX_X64 || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: { components: clippy, system: build, pdfium: "false", sevenzip: "false" }
      - run: cargo clippy --workspace --all-targets ${{ env.RICK_WS_FEATURES }} -- -D warnings
      # Shares clippy's check artifacts, so it costs seconds here.
      - run: cargo doc --no-deps ${{ env.RICK_WS_FEATURES }}
        env: { RUSTDOCFLAGS: "-D warnings" }
  test:
    needs: [changes, fmt]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ vars.RUNNER_LINUX_X64 || 'ubuntu-24.04' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: { system: test }
      # Issues 21 and 34: the provider plugins' round trips run against
      # MinIO, Azurite, fake-gcs-server and the sshd containers; the tests
      # skip with a note without the RICK_* variables and fail instead here.
      - name: storage and ssh containers
        run: .github/scripts/containers.sh
      # Issue 24: a permission change the user may not make runs in the
      # privileged helper through pkexec; no desktop here shows polkit's
      # prompt, so a stand-in runs the helper through the runner's sudo and
      # the elevation test (crates/rick/tests/perms.rs) runs for real.
      - name: polkit stand-in
        run: |
          sudo install -m 755 .github/scripts/fake-pkexec.sh /usr/local/bin/pkexec
          echo "RICK_ELEVATE_FIXTURE=1" >> "$GITHUB_ENV"
      # With Tracker and Baloo indexing a fixture directory on a private
      # session bus, so the two connectors answer through their real
      # services (issue 22).
      - run: .github/scripts/with-indexers.sh cargo test --workspace ${{ env.RICK_WS_FEATURES }}
  bundle:
    needs: [changes, fmt]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ vars.RUNNER_LINUX_X64 || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: { system: build, pdfium: "false" }
      # Issue 16: target/debug/bundle/ with the binary, the kernel dylibs,
      # libstd and plugins/<id>/ per plugin, from one build of the whole
      # workspace (QUESTIONS.md 81).
      - run: cargo xtask bundle ${{ env.RICK_WS_FEATURES }}
      # Every plugin built for this platform loads through --list-plugins;
      # the connectors for the other platforms are not bundled (issue 22);
      # the 7-Zip library sits beside the archive plugin (issue 51).
      - name: list plugins
        run: .github/scripts/check-plugins.sh target/debug/bundle
  tier1:
    name: tier 1
    # The one check to require: green when every job above succeeded or was
    # skipped for a docs-only change, red on any failure.
    needs: [changes, fmt, deny, clippy, test, bundle]
    if: always()
    runs-on: ${{ vars.RUNNER_LINUX_X64 || 'ubuntu-24.04' }}
    timeout-minutes: 5
    steps:
      - env: { RESULTS: "${{ toJSON(needs) }}" }
        run: |
          echo "$RESULTS"
          jq -e 'map(.result) | all(. == "success" or . == "skipped")' <<< "$RESULTS" > /dev/null \
            || { echo "a job failed or was cancelled"; exit 1; }
