name: ci
on: [push, pull_request]
jobs:
  check:
    strategy:
      # One platform failing must not cancel the others: their results are
      # the point of the matrix.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # The Windows runner spends about 27 minutes on the steps and several
    # more saving the cache, which the shared libraries and the plugin
    # libraries made larger (CI run 168 was cancelled in that save at 30).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      # pdfium for the PDF previewer: the release binary for this runner,
      # bound through RICK_PDFIUM_DIR; RICK_REQUIRE_PDFIUM makes its tests
      # fail rather than skip when the binding is missing.
      - name: pdfium
        shell: bash
        run: |
          case "${{ runner.os }}-${{ runner.arch }}" in
            Linux-X64) asset=pdfium-linux-x64 ;;
            Linux-ARM64) asset=pdfium-linux-arm64 ;;
            macOS-ARM64) asset=pdfium-mac-arm64 ;;
            macOS-X64) asset=pdfium-mac-x64 ;;
            Windows-X64) asset=pdfium-win-x64 ;;
            *) echo "no pdfium build for ${{ runner.os }}-${{ runner.arch }}"; exit 1 ;;
          esac
          # Git Bash's tar reads a Windows path's drive colon as a host, so
          # work in POSIX form there and hand Rust the Windows form.
          dest="$RUNNER_TEMP/pdfium"
          if [ "${{ runner.os }}" = "Windows" ]; then
            dest="$(cygpath -u "$RUNNER_TEMP")/pdfium"
          fi
          mkdir -p "$dest"
          curl -sSL "https://github.com/bblanchon/pdfium-binaries/releases/latest/download/$asset.tgz" | tar xz -C "$dest"
          if [ "${{ runner.os }}" = "Windows" ]; then
            echo "RICK_PDFIUM_DIR=$(cygpath -w "$dest/bin")" >> "$GITHUB_ENV"
          else
            echo "RICK_PDFIUM_DIR=$dest/lib" >> "$GITHUB_ENV"
          fi
          echo "RICK_REQUIRE_PDFIUM=1" >> "$GITHUB_ENV"
      - run: cargo fmt --check
      # No Unicode symbol character is used as an icon (SPEC.md "Icons").
      - run: "! grep -rnP '(*UTF8)[\\x{2190}-\\x{2BFF}\\x{1F300}-\\x{1FAFF}]' crates/ui-egui/src"
        if: runner.os == 'Linux'
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --workspace
      # Issue 16: the bundle, target/debug/bundle/ with the binary, the kernel
      # dylibs, libstd and plugins/git/ and plugins/preview-hex/ (the viewer's
      # hex fallback, issue 17), and the host loading both from it. The same
      # whole-workspace build as the tests: a smaller package set would
      # rewrite the shared libraries (QUESTIONS.md 81).
      - run: cargo xtask bundle
      - name: list plugins
        shell: bash
        run: |
          exe=""
          if [ "$RUNNER_OS" = "Windows" ]; then exe=".exe"; fi
          ls -l target/debug/bundle target/debug/bundle/plugins/git target/debug/bundle/plugins/preview-hex
          test -f target/debug/bundle/plugins/git/plugin.toml || { echo "no plugin.toml"; exit 1; }
          test -f target/debug/bundle/plugins/preview-hex/plugin.toml || { echo "no hex plugin.toml"; exit 1; }
          out="$("./target/debug/bundle/rick$exe" --list-plugins)"
          echo "$out"
          echo "$out" | grep -E '^git +Git +[^ ]+ +decorator, action +loaded +' || { echo "git plugin not loaded"; exit 1; }
          echo "$out" | grep -E '^preview-hex +Hex preview +[^ ]+ +previewer +loaded +' || { echo "hex plugin not loaded"; exit 1; }
      # The acceptance benchmarks, each asserting the target of the runner's
      # OS from crates/tests/src/bench.rs (BENCHMARKS.md has the numbers):
      # all three OSes assert, nothing is soft.
      # Issue 1: the 200k-entry fixture, written on the runner's temp disk,
      # the fast local drive on Windows (QUESTIONS.md 5 for its target).
      - run: cargo test -p tests --release --test fixture -- --ignored --nocapture
        env: { TMP: "${{ runner.temp }}", TEMP: "${{ runner.temp }}", TMPDIR: "${{ runner.temp }}" }
      # Issue 2: listing the 200k fixture and the 1 GiB sparse copy.
      - run: cargo test -p tests --release --test listing --test copy -- --ignored --nocapture
        env: { TMP: "${{ runner.temp }}", TEMP: "${{ runner.temp }}", TMPDIR: "${{ runner.temp }}" }
      # Issue 4: scrolling the 200k fixture in details view, on egui's CPU
      # frame (QUESTIONS.md 24).
      - run: cargo test -p tests --release --test ui -- --ignored --nocapture
        env: { TMP: "${{ runner.temp }}", TEMP: "${{ runner.temp }}", TMPDIR: "${{ runner.temp }}" }
      # Issue 5: the 48 MB bitmap's and the 300-page PDF's first frame, and
      # the UI frames while they decode (QUESTIONS.md 30).
      - run: cargo test -p tests --release --test preview -- --ignored --nocapture
        env: { TMP: "${{ runner.temp }}", TEMP: "${{ runner.temp }}", TMPDIR: "${{ runner.temp }}" }
      # Issue 6: decorating a visible batch of a generated 10 000-file
      # repository, cached and pending, and the completion of the status read.
      - run: cargo test -p tests --release --test git -- --ignored --nocapture
        env: { TMP: "${{ runner.temp }}", TEMP: "${{ runner.temp }}", TMPDIR: "${{ runner.temp }}" }
      - run: cargo doc --no-deps
        env: { RUSTDOCFLAGS: "-D warnings" }
      # GUI chrome: the icon view's thumbnails and the frames while they arrive.
      - run: cargo test -p tests --release --test chrome -- --ignored --nocapture
        env: { TMP: "${{ runner.temp }}", TEMP: "${{ runner.temp }}", TMPDIR: "${{ runner.temp }}" }
      # Preview pane: 200 000 wrapped lines, the worst frame.
      - run: cargo test -p tests --release --test preview_pane -- --ignored --nocapture
        env: { TMP: "${{ runner.temp }}", TEMP: "${{ runner.temp }}", TMPDIR: "${{ runner.temp }}" }
      # Release: startup to the first frame.
      - run: cargo test -p tests --release --test startup -- --ignored --nocapture
        env: { TMP: "${{ runner.temp }}", TEMP: "${{ runner.temp }}", TMPDIR: "${{ runner.temp }}" }
      # Issue 16: loading the Git plugin at start, within 50 ms on Linux.
      - run: cargo test -p tests --release --test plugins -- --ignored --nocapture
        env: { TMP: "${{ runner.temp }}", TEMP: "${{ runner.temp }}", TMPDIR: "${{ runner.temp }}" }
      # Close-out A: the tree view's first screen on the 200k fixture, the
      # first search batch, Recent's first row, and the 1 GiB sparse copy's
      # row with pause and cancel.
      - run: cargo test -p tests --release --test closeout -- --ignored --nocapture --test-threads=1
        env: { TMP: "${{ runner.temp }}", TEMP: "${{ runner.temp }}", TMPDIR: "${{ runner.temp }}" }
      # Close-out A and B, the two timed tests that are not #[ignore]d:
      # Recent's first row, and a three-window, twenty-tab session starting
      # about as fast as a one-tab one; in release so the targets apply.
      - run: cargo test -p tests --release --test closeout --test session -- --nocapture --test-threads=1 recent_shows_a_touched_file a_big_session_starts
        env: { TMP: "${{ runner.temp }}", TEMP: "${{ runner.temp }}", TMPDIR: "${{ runner.temp }}" }
      # Screenshots of the chrome for the pull request, through wgpu on the
      # runner's software adapter: lavapipe on Linux, Metal on macOS. Not on
      # Windows: the dx12 software adapter (WARP) on the runner crashed the
      # test process once in four runs (run 42314323512), and a screenshot
      # step that fails by chance would block a release.
      - run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get install -y mesa-vulkan-drivers; fi
          cargo test -p tests --release --features screenshots --test screenshots -- --ignored --nocapture
        if: runner.os != 'Windows'
        shell: bash
        env: { TMP: "${{ runner.temp }}", TEMP: "${{ runner.temp }}", TMPDIR: "${{ runner.temp }}", WGPU_BACKEND: "${{ runner.os == 'Windows' && 'dx12' || runner.os == 'macOS' && 'metal' || 'vulkan' }}" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ runner.os }}
          path: target/screenshots/
          if-no-files-found: ignore
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
