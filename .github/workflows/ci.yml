name: ci
# Tier 1 of the pipeline (issue 35): the fast checks of a pull request into
# dev, on Linux x64 only, in a few minutes. fmt first, then side by side
# clippy with the docs, the tests in debug, and the bundle of the binary
# with every plugin loading; cargo deny beside them. The pull request from
# dev into main runs the full matrix (full.yml); the benchmarks are
# bench.yml and never block a pull request.
#
# A new push cancels the branch's running check. A change to documentation
# only (Markdown, docs/) builds nothing: the `changes` job says so, the
# other jobs are skipped, and `tier 1`, the one check to require, still
# reports success.
on:
  pull_request:
    branches: [dev]
  # Each merge into dev: the check after the fact, and the cache the pull
  # requests into dev restore from.
  push:
    branches: [dev]
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  # Issue 18: the media previewer's playback is built against the system
  # GStreamer on Linux. The kernel dylibs are built once per feature set,
  # so every cargo command carries the same features (QUESTIONS.md 81).
  RICK_WS_FEATURES: --features ext-preview-media/gstreamer,tests/gstreamer
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        run: .github/scripts/docs-only.sh
        env:
          GH_TOKEN: ${{ github.token }}
  fmt:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt }
      - run: cargo fmt --check
      # No Unicode symbol character is used as an icon (SPEC.md "Icons").
      - run: "! grep -rnP '(*UTF8)[\\x{2190}-\\x{2BFF}\\x{1F300}-\\x{1FAFF}]' crates/ui-egui/src"
  deny:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
  # The three builds run side by side once fmt has passed, each from its own
  # cache; the whole tier takes as long as the slowest of them.
  clippy:
    needs: [changes, fmt]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: { components: clippy, system: build, pdfium: "false" }
      - run: cargo clippy --workspace --all-targets ${{ env.RICK_WS_FEATURES }} -- -D warnings
      # Shares clippy's check artifacts, so it costs seconds here.
      - run: cargo doc --no-deps ${{ env.RICK_WS_FEATURES }}
        env: { RUSTDOCFLAGS: "-D warnings" }
  test:
    needs: [changes, fmt]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: { system: test }
      - run: cargo test --workspace ${{ env.RICK_WS_FEATURES }}
  bundle:
    needs: [changes, fmt]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: { system: build, pdfium: "false" }
      # Issue 16: target/debug/bundle/ with the binary, the kernel dylibs,
      # libstd and plugins/<id>/ per plugin, from one build of the whole
      # workspace (QUESTIONS.md 81).
      - run: cargo xtask bundle ${{ env.RICK_WS_FEATURES }}
      # Every plugin loads through --list-plugins.
      - name: list plugins
        run: |
          ls -l target/debug/bundle target/debug/bundle/plugins
          for id in git vfs-trash vfs-archive preview-archive preview-csv preview-media preview-office preview-hex; do
            test -f "target/debug/bundle/plugins/$id/plugin.toml" || { echo "no plugin.toml for $id"; exit 1; }
          done
          out="$(./target/debug/bundle/rick --list-plugins)"
          echo "$out"
          echo "$out" | grep -E '^git +Git +[^ ]+ +decorator, action +loaded +' || { echo "git plugin not loaded"; exit 1; }
          echo "$out" | grep -E '^vfs-trash +Trash +[^ ]+ +provider, decorator, action +loaded +' || { echo "trash plugin not loaded"; exit 1; }
          echo "$out" | grep -E '^vfs-archive +Archives +[^ ]+ +provider +loaded +' || { echo "archive plugin not loaded"; exit 1; }
          for id in preview-archive preview-csv preview-media preview-office preview-hex; do
            echo "$out" | grep -E "^$id +[^ ].* +previewer +loaded +" || { echo "$id plugin not loaded"; exit 1; }
          done
  tier1:
    name: tier 1
    # The one check to require: green when every job above succeeded or was
    # skipped for a docs-only change, red on any failure.
    needs: [changes, fmt, deny, clippy, test, bundle]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env: { RESULTS: "${{ toJSON(needs) }}" }
        run: |
          echo "$RESULTS"
          jq -e 'map(.result) | all(. == "success" or . == "skipped")' <<< "$RESULTS" > /dev/null \
            || { echo "a job failed or was cancelled"; exit 1; }
