name: ci
on: [push, pull_request]
jobs:
  check:
    strategy:
      # One platform failing must not cancel the others: their results are
      # the point of the matrix.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      # pdfium for the PDF previewer: the release binary for this runner,
      # bound through RICK_PDFIUM_DIR; RICK_REQUIRE_PDFIUM makes its tests
      # fail rather than skip when the binding is missing.
      - name: pdfium
        shell: bash
        run: |
          case "${{ runner.os }}-${{ runner.arch }}" in
            Linux-X64) asset=pdfium-linux-x64 ;;
            Linux-ARM64) asset=pdfium-linux-arm64 ;;
            macOS-ARM64) asset=pdfium-mac-arm64 ;;
            macOS-X64) asset=pdfium-mac-x64 ;;
            Windows-X64) asset=pdfium-win-x64 ;;
            *) echo "no pdfium build for ${{ runner.os }}-${{ runner.arch }}"; exit 1 ;;
          esac
          # Git Bash's tar reads a Windows path's drive colon as a host, so
          # work in POSIX form there and hand Rust the Windows form.
          dest="$RUNNER_TEMP/pdfium"
          if [ "${{ runner.os }}" = "Windows" ]; then
            dest="$(cygpath -u "$RUNNER_TEMP")/pdfium"
          fi
          mkdir -p "$dest"
          curl -sSL "https://github.com/bblanchon/pdfium-binaries/releases/latest/download/$asset.tgz" | tar xz -C "$dest"
          if [ "${{ runner.os }}" = "Windows" ]; then
            echo "RICK_PDFIUM_DIR=$(cygpath -w "$dest/bin")" >> "$GITHUB_ENV"
          else
            echo "RICK_PDFIUM_DIR=$dest/lib" >> "$GITHUB_ENV"
          fi
          echo "RICK_REQUIRE_PDFIUM=1" >> "$GITHUB_ENV"
      - run: cargo fmt --check
      # No Unicode symbol character is used as an icon (SPEC.md "Icons").
      - run: "! grep -rnP '(*UTF8)[\\x{2190}-\\x{2BFF}\\x{1F300}-\\x{1FAFF}]' crates/ui-egui/src"
        if: runner.os == 'Linux'
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --workspace
      # Acceptance (issue 1): the 200k-entry fixture generates in under 30 s.
      # Written on the runner's temp disk, the fast local drive on Windows.
      # The 30 s budget is enforced on Linux only for now (QUESTIONS.md 5):
      # on Windows and macOS the step still runs and logs its time, but
      # cannot fail the job.
      - run: cargo test -p tests --test fixture -- --ignored
        continue-on-error: ${{ runner.os != 'Linux' }}
        env: { TMP: "${{ runner.temp }}", TEMP: "${{ runner.temp }}", TMPDIR: "${{ runner.temp }}" }
      # Acceptance (issue 2): listing the 200k fixture and the 1 GiB sparse
      # copy, in release so the timings mean something. The Linux numbers are
      # asserted; macOS and Windows print theirs until targets are set.
      - run: cargo test -p tests --release --test listing --test copy -- --ignored --nocapture
        env: { TMP: "${{ runner.temp }}", TEMP: "${{ runner.temp }}", TMPDIR: "${{ runner.temp }}" }
      # Acceptance (issue 4): scrolling the 200k fixture in details view
      # stays under the 60 fps frame budget, measured on egui's CPU frame
      # (QUESTIONS.md 24). The budget is enforced on Linux; macOS and Windows
      # print their numbers until targets are set from measurements.
      - run: cargo test -p tests --release --test ui -- --ignored --nocapture
        continue-on-error: ${{ runner.os != 'Linux' }}
        env: { TMP: "${{ runner.temp }}", TEMP: "${{ runner.temp }}", TMPDIR: "${{ runner.temp }}" }
      # Acceptance (issue 5): a 48 MB bitmap and a 300-page PDF show their
      # first frame within 200 ms and no UI frame goes over 16.6 ms while
      # they decode (QUESTIONS.md 30). Linux asserts; the others print.
      - run: cargo test -p tests --release --test preview -- --ignored --nocapture
        continue-on-error: ${{ runner.os != 'Linux' }}
        env: { TMP: "${{ runner.temp }}", TEMP: "${{ runner.temp }}", TMPDIR: "${{ runner.temp }}" }
      # Acceptance (issue 6): decorating a visible batch of a generated
      # 10 000-file repository returns within 16 ms and completes within
      # 500 ms. Linux asserts; the others print.
      - run: cargo test -p tests --release --test git -- --ignored --nocapture
        continue-on-error: ${{ runner.os != 'Linux' }}
        env: { TMP: "${{ runner.temp }}", TEMP: "${{ runner.temp }}", TMPDIR: "${{ runner.temp }}" }
      - run: cargo doc --no-deps
        env: { RUSTDOCFLAGS: "-D warnings" }
      # Acceptance (GUI chrome): the icon view's thumbnails within 500 ms
      # and no long frame while they arrive. Linux asserts; the others print.
      - run: cargo test -p tests --release --test chrome -- --ignored --nocapture
        continue-on-error: ${{ runner.os != 'Linux' }}
        env: { TMP: "${{ runner.temp }}", TEMP: "${{ runner.temp }}", TMPDIR: "${{ runner.temp }}" }
      # Acceptance (preview pane): 200 000 wrapped lines, every frame under
      # 16.6 ms. Linux asserts; the others print.
      - run: cargo test -p tests --release --test preview_pane -- --ignored --nocapture
        continue-on-error: ${{ runner.os != 'Linux' }}
        env: { TMP: "${{ runner.temp }}", TEMP: "${{ runner.temp }}", TMPDIR: "${{ runner.temp }}" }
      # Acceptance (close-out A): the tree view's first screen on the 200k
      # fixture within 50 ms, the first search batch within 100 ms, and the
      # 1 GiB sparse copy's row with pause and cancel. Linux asserts the
      # budgets; the others print.
      - run: cargo test -p tests --release --test closeout -- --ignored --nocapture --test-threads=1
        continue-on-error: ${{ runner.os != 'Linux' }}
        env: { TMP: "${{ runner.temp }}", TEMP: "${{ runner.temp }}", TMPDIR: "${{ runner.temp }}" }
      # Screenshots of the chrome for the pull request, through wgpu on the
      # runner's software adapter; best effort on every OS.
      - run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get install -y mesa-vulkan-drivers; fi
          cargo test -p tests --release --features screenshots --test screenshots -- --ignored --nocapture
        shell: bash
        continue-on-error: true
        env: { TMP: "${{ runner.temp }}", TEMP: "${{ runner.temp }}", TMPDIR: "${{ runner.temp }}", WGPU_BACKEND: "${{ runner.os == 'Windows' && 'dx12' || runner.os == 'macOS' && 'metal' || 'vulkan' }}" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ runner.os }}
          path: target/screenshots/
          if-no-files-found: ignore
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
