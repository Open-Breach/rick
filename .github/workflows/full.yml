name: full
# Tier 2 of the pipeline (issue 35): the full matrix, Linux x64, Linux
# arm64, macOS arm64 and Windows x64, on the pull request from dev into
# main, which `tier 2` must pass before it merges; nightly on dev; and by
# hand from the Actions tab. Every runner takes tier 1's checks (fmt,
# clippy, the tests, the bundle with every plugin loading, the docs); Linux
# x64 adds the integration tests on the 200k fixture, Linux x64 and macOS
# the screenshots; cargo deny runs beside them. The timings are bench.yml.
#
# A new push cancels the pull request's running check; a docs-only change
# builds nothing and `tier 2` still reports success. A schedule runs from
# main's copy of this file and checks dev out, so dev must carry
# .github/actions/setup and .github/scripts: it does once it is level with
# main.
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
concurrency:
  group: full-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  # The nightly run measures dev; everything else the ref that started it.
  CHECKOUT_REF: ${{ github.event_name == 'schedule' && 'dev' || '' }}
jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        run: .github/scripts/docs-only.sh
        env:
          GH_TOKEN: ${{ github.token }}
  check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      # One platform failing must not cancel the others: their results are
      # the point of the matrix.
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    # The Windows runner spends about 15 minutes on the steps and several
    # more saving the cache, which the shared libraries and the plugin
    # libraries made larger.
    timeout-minutes: 45
    # Issue 18: the media previewer's playback is built only where the
    # GStreamer development files are (Linux, from the system packages);
    # macOS and Windows build it without, and the release workflow bundles
    # the runtime there. The two variables carry the feature to every cargo
    # command of the job, so the kernel dylibs are built once per profile
    # (QUESTIONS.md 81).
    env:
      RICK_WS_FEATURES: ${{ startsWith(matrix.os, 'ubuntu') && '--features ext-preview-media/gstreamer,tests/gstreamer' || '' }}
      RICK_TESTS_FEATURES: ${{ startsWith(matrix.os, 'ubuntu') && '--features gstreamer' || '' }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.CHECKOUT_REF }}" }
      - uses: ./.github/actions/setup
        with: { components: "rustfmt, clippy", system: test }
      # Diagnostic (throwaway branch): is a new file under the fixture
      # directory indexed by Windows Search at all, and how soon, asked
      # through the index's own OLE DB provider rather than Rick.
      - name: windows search indexing probe
        shell: pwsh
        run: |
          Get-Service WSearch | Format-List Name, Status, StartType
          $fixture = $env:RICK_SEARCH_FIXTURE
          $stem = "ricksearchprobe$([DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds())"
          $file = Join-Path $fixture "$stem.txt"
          Set-Content -Path $file -Value "indexed by the probe"
          $conn = New-Object System.Data.OleDb.OleDbConnection("Provider=Search.CollatorDSO;Extended Properties='Application=Windows';")
          $conn.Open()
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $found = $false
          while ($sw.Elapsed.TotalSeconds -lt 600) {
            $cmd = $conn.CreateCommand()
            $cmd.CommandText = "SELECT System.ItemPathDisplay FROM SystemIndex WHERE System.FileName LIKE '$stem%'"
            $r = $cmd.ExecuteReader()
            while ($r.Read()) { $found = $true; Write-Host "found: $($r[0]) after $($sw.Elapsed)" }
            $r.Close()
            if ($found) { break }
            Start-Sleep -Seconds 10
          }
          $cmd = $conn.CreateCommand()
          $cmd.CommandText = "SELECT TOP 5 System.ItemPathDisplay FROM SystemIndex WHERE SCOPE='file:$fixture'"
          $r = $cmd.ExecuteReader(); $n = 0
          while ($r.Read()) { $n++; Write-Host "in scope: $($r[0])" }
          $r.Close()
          Write-Host "items under the fixture scope: $n"
          $cmd.CommandText = "SELECT TOP 3 System.ItemPathDisplay FROM SystemIndex WHERE SCOPE='file:$env:USERPROFILE'"
          $r = $cmd.ExecuteReader(); $n = 0
          while ($r.Read()) { $n++; Write-Host "under the profile: $($r[0])" }
          $r.Close()
          Write-Host "profile items sampled: $n"
          if (-not $found) { Write-Host "::warning::the file was not indexed within ten minutes" }
      - uses: actions/upload-artifact@v4
        if: always() && (matrix.os == 'ubuntu-24.04' || runner.os == 'macOS')
        with:
          name: screenshots-${{ runner.os }}
          path: target/screenshots/
          if-no-files-found: ignore
  deny:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.CHECKOUT_REF }}" }
      - uses: EmbarkStudios/cargo-deny-action@v2
  tier2:
    name: tier 2
    # The one check main requires: green when every job above succeeded or
    # was skipped for a docs-only change, red on any failure.
    needs: [changes, check, deny]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env: { RESULTS: "${{ toJSON(needs) }}" }
        run: |
          echo "$RESULTS"
          jq -e 'map(.result) | all(. == "success" or . == "skipped")' <<< "$RESULTS" > /dev/null \
            || { echo "a job failed or was cancelled"; exit 1; }
