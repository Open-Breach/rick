name: release
# On a `v*` tag: a release build on every OS, one archive per platform with
# the bundle `cargo xtask bundle --release` lays out — the binary, the kernel
# dylibs and libstd it shares with the plugins, the pdfium library beside it
# (SPEC.md: pdfium ships beside the binary), the GStreamer runtime on macOS
# and Windows (SPEC.md: bundled there, the system's on Linux; QUESTIONS.md
# 89) and `plugins/` with every plugin (QUESTIONS.md 81) — plus LICENSE,
# README, CHANGELOG and the third-party
# licenses; a smoke test of every archive; then a GitHub Release with the archives, their
# SHA-256 sums and the tag's changelog section as its body. A tag with a
# pre-release suffix (v0.1.0-rc1) makes a draft pre-release; a plain tag
# publishes. Run by hand from a branch with a tag name, it is a dry run: the
# same build and smoke test, then a draft release under that name on the
# branch's commit (the tag itself is only created if the draft is published).
# No signing, notarisation or installers in 0.1.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release as this tag (vX.Y.Z or vX.Y.Z-rcN); a draft is created"
        required: true
permissions:
  contents: write
env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}
  # The GStreamer release whose official macOS and Windows packages the
  # archives bundle; Linux builds against the system packages.
  GSTREAMER_VERSION: "1.28.8"
jobs:
  licenses:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-about }
      # about.toml lists the four release targets, so one run covers them all.
      - run: cargo about generate about.hbs -o THIRD-PARTY-LICENSES.md
      - uses: actions/upload-artifact@v4
        with: { name: third-party-licenses, path: THIRD-PARTY-LICENSES.md }

  build:
    needs: licenses
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux-x64, pdfium: pdfium-linux-x64 }
          # aarch64 Linux builds natively on GitHub's arm runner, no cross
          # toolchain needed.
          - { os: ubuntu-24.04-arm, platform: linux-arm64, pdfium: pdfium-linux-arm64 }
          - { os: macos-latest, platform: macos-arm64, pdfium: pdfium-mac-arm64 }
          - { os: windows-latest, platform: windows-x64, pdfium: pdfium-win-x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # GStreamer for the media previewer (issue 18). Linux: the system
      # packages, development files for the build and the codec plug-ins
      # for the smoke test; the archive relies on the user's GStreamer.
      # macOS and Windows: the official runtime and development packages,
      # installed where their installers put them; the runtime is copied
      # into the bundle (RICK_GSTREAMER_DIR, QUESTIONS.md 106). The new
      # Windows installer is one Inno Setup executable per architecture.
      - name: gstreamer (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly gstreamer1.0-libav
      - name: gstreamer (macos)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          base="https://gstreamer.freedesktop.org/data/pkg/osx/$GSTREAMER_VERSION"
          for pkg in gstreamer-1.0 gstreamer-1.0-devel; do
            curl -sSL -o "$RUNNER_TEMP/$pkg.pkg" "$base/$pkg-$GSTREAMER_VERSION-universal.pkg"
            sudo installer -pkg "$RUNNER_TEMP/$pkg.pkg" -target /
          done
          framework="/Library/Frameworks/GStreamer.framework/Versions/1.0"
          echo "PKG_CONFIG_PATH=$framework/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "RICK_GSTREAMER_DIR=$framework" >> "$GITHUB_ENV"
          echo "$framework/bin" >> "$GITHUB_PATH"
      - name: gstreamer (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $base = "https://gstreamer.freedesktop.org/data/pkg/windows/$env:GSTREAMER_VERSION/msvc"
          $installer = "$env:RUNNER_TEMP\gstreamer.exe"
          Invoke-WebRequest -Uri "$base/gstreamer-1.0-msvc-x86_64-$env:GSTREAMER_VERSION.exe" -OutFile $installer
          $root = "C:\gstreamer\1.0\msvc_x86_64"
          Start-Process -FilePath $installer -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/TYPE=full", "/DIR=$root" -Wait
          if (-not (Test-Path "$root\lib\pkgconfig\gstreamer-1.0.pc")) {
            Get-ChildItem $root -Recurse -Depth 2 | Select-Object -First 50 FullName
            throw "the GStreamer installer did not put the development files under $root"
          }
          "PKG_CONFIG_PATH=$root\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RICK_GSTREAMER_DIR=$root" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$root\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      # The version is the tag's; its release part must be the workspace's,
      # so `rick --version` and the archive name agree. During a cycle the
      # workspace carries a `-dev` suffix, which a dry run may keep.
      - name: version
        shell: bash
        run: |
          tag_version="${TAG#v}"
          crate_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          if [ "${tag_version%%-*}" != "${crate_version%%-*}" ]; then
            echo "tag $TAG does not match workspace version $crate_version"
            exit 1
          fi
          echo "VERSION=$tag_version" >> "$GITHUB_ENV"
          echo "NAME=rick-$tag_version-${{ matrix.platform }}" >> "$GITHUB_ENV"
      - name: pdfium
        shell: bash
        run: |
          dest="$RUNNER_TEMP/pdfium"
          if [ "${{ runner.os }}" = "Windows" ]; then
            dest="$(cygpath -u "$RUNNER_TEMP")/pdfium"
          fi
          mkdir -p "$dest"
          curl -sSL "https://github.com/bblanchon/pdfium-binaries/releases/latest/download/${{ matrix.pdfium }}.tgz" | tar xz -C "$dest"
          if [ "${{ runner.os }}" = "Windows" ]; then
            echo "PDFIUM_LIB=$dest/bin/pdfium.dll" >> "$GITHUB_ENV"
            echo "RICK_PDFIUM_DIR=$(cygpath -w "$dest/bin")" >> "$GITHUB_ENV"
          elif [ "${{ runner.os }}" = "macOS" ]; then
            echo "PDFIUM_LIB=$dest/lib/libpdfium.dylib" >> "$GITHUB_ENV"
            echo "RICK_PDFIUM_DIR=$dest/lib" >> "$GITHUB_ENV"
          else
            echo "PDFIUM_LIB=$dest/lib/libpdfium.so" >> "$GITHUB_ENV"
            echo "RICK_PDFIUM_DIR=$dest/lib" >> "$GITHUB_ENV"
          fi
      # The bundle: binary, kernel dylibs, libstd, pdfium (from
      # RICK_PDFIUM_DIR), the GStreamer runtime (from RICK_GSTREAMER_DIR on
      # macOS and Windows) and plugins/, from one build of every library,
      # binary and example in the workspace with the media previewer's
      # playback on, the previewer's pdfium_check example for the smoke
      # test among them.
      - run: cargo xtask bundle --release --features ext-preview-media/gstreamer
      # The official macOS libraries are universal; the archive is for
      # Apple silicon, so the other half goes.
      - name: thin the gstreamer libraries
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          find target/release/bundle/gstreamer -type f \( -name '*.dylib' -o -name 'gst-plugin-scanner' \) | while read -r file; do
            if lipo -info "$file" 2>/dev/null | grep -q "arm64"; then
              lipo -thin arm64 "$file" -output "$file.thin" 2>/dev/null && mv "$file.thin" "$file" || true
            fi
          done
          du -sh target/release/bundle/gstreamer
      - uses: actions/download-artifact@v4
        with: { name: third-party-licenses }
      - name: package
        shell: bash
        run: |
          set -euo pipefail
          exe=""
          if [ "${{ runner.os }}" = "Windows" ]; then exe=".exe"; fi
          mkdir -p "dist/$NAME"
          cp -R target/release/bundle/. "dist/$NAME/"
          cp LICENSE README.md CHANGELOG.md THIRD-PARTY-LICENSES.md "dist/$NAME/"
          ls -lR "dist/$NAME"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip "$NAME.zip" "$NAME" > /dev/null
            archive="$NAME.zip"
          else
            tar czf "$NAME.tar.gz" "$NAME"
            archive="$NAME.tar.gz"
          fi
          if command -v sha256sum > /dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          cat "$archive.sha256"
          rm -r "$NAME"
          mkdir -p ../check
          cp "../target/release/examples/pdfium_check$exe" ../check/
      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: pdfium-check-${{ matrix.platform }}
          path: check/
          if-no-files-found: error

  # Each archive, as a user gets it: unpacked in an empty directory, the
  # binary reports its version, lists every plugin of the platform as
  # loaded, and pdfium loads from beside it.
  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux-x64 }
          - { os: ubuntu-24.04-arm, platform: linux-arm64 }
          - { os: macos-latest, platform: macos-arm64 }
          - { os: windows-latest, platform: windows-x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      # For .github/scripts/check-plugins.sh, the per-platform plugin check.
      - uses: actions/checkout@v4
      # The Linux archives use the system GStreamer: the media plugin links
      # it and loads only where it is installed, as a user's desktop has it.
      - name: gstreamer (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgstreamer1.0-0 libgstreamer-plugins-base1.0-0 gstreamer1.0-plugins-good
      - uses: actions/download-artifact@v4
        with: { name: "archive-${{ matrix.platform }}", path: dist }
      - uses: actions/download-artifact@v4
        with: { name: "pdfium-check-${{ matrix.platform }}", path: check }
      - name: smoke test
        shell: bash
        env:
          RICK_PDFIUM_DIR: ""
        run: |
          set -euo pipefail
          unset RICK_PDFIUM_DIR
          version="${TAG#v}"
          name="rick-$version-${{ matrix.platform }}"
          exe=""
          if [ "${{ runner.os }}" = "Windows" ]; then exe=".exe"; fi
          cd dist
          if command -v sha256sum > /dev/null; then sha256sum -c "$name".*.sha256; else shasum -a 256 -c "$name".*.sha256; fi
          mkdir empty && cd empty
          if [ -f "../$name.zip" ]; then 7z x "../$name.zip" > /dev/null; else tar xzf "../$name.tar.gz"; fi
          cd "$name"
          ls -l
          for file in "rick$exe" LICENSE README.md CHANGELOG.md THIRD-PARTY-LICENSES.md; do
            test -f "$file" || { echo "missing $file"; exit 1; }
          done
          test -f libpdfium.so || test -f libpdfium.dylib || test -f pdfium.dll || { echo "no pdfium library beside the binary"; exit 1; }
          # The GStreamer runtime the media previewer plays through, bundled
          # on macOS and Windows (QUESTIONS.md 106).
          case "${{ runner.os }}" in
            macOS) test -f gstreamer/lib/libgstreamer-1.0.0.dylib || { echo "no bundled GStreamer"; exit 1; }
                   ls gstreamer/lib/gstreamer-1.0 | head -5 ;;
            Windows) test -f gstreamer-1.0-0.dll || { echo "no bundled GStreamer"; exit 1; }
                     ls gstreamer-1.0 | head -5 ;;
          esac
          # The kernel dylibs and libstd the binary shares with the plugins.
          ls -1 | grep -Eq '^(lib)?std-' || { echo "no libstd beside the binary"; exit 1; }
          ls -1 | grep -Eq '^(lib)?ext\.' || { echo "no ext library beside the binary"; exit 1; }
          # The version line: the workspace version (the tag without any
          # pre-release suffix, a `-dev` workspace keeps its suffix) and the
          # git hash in brackets.
          out="$("./rick$exe" --version)"
          echo "rick --version: $out"
          echo "$out" | grep -Eq "^${version%%-*}(-[0-9A-Za-z.]+)? \([0-9a-f]{7,}\)$" || { echo "unexpected version line"; exit 1; }
          # The plugins, bundled and loaded from plugins/<id>/: Git and SVN,
          # the archive and trash providers of issue 20, the four previewers
          # of issue 18, the hex fallback of issue 17, the subdirectory
          # search and this platform's index connector of issue 22. The
          # media previewer loading on macOS and Windows shows the bundled
          # GStreamer runtime resolves; on Linux the runner's system
          # GStreamer does.
          "$GITHUB_WORKSPACE/.github/scripts/check-plugins.sh" .
          # pdfium from beside the binary: the previewer's test binary, copied
          # next to rick, with RICK_PDFIUM_DIR unset and no system pdfium. The
          # example has no run path of its own, so the library path names the
          # directory for the kernel dylibs and libstd.
          cp "../../../check/pdfium_check$exe" .
          chmod +x "pdfium_check$exe"
          LD_LIBRARY_PATH=. DYLD_LIBRARY_PATH=. "./pdfium_check$exe" | tee check.txt
          grep -q "^pdfium ok" check.txt

  release:
    needs: [build, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: "archive-*", path: dist, merge-multiple: true }
      - name: checksums and body
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          cat ./*.sha256 | sort -k2 > SHA256SUMS.txt
          rm ./*.sha256
          cat SHA256SUMS.txt
          cd ..
          python3 .github/scripts/changelog-section.py "$TAG" CHANGELOG.md > body.md
          {
            echo
            echo "Archives: the \`rick\` binary with the shared kernel libraries, libstd and the pdfium library beside it, \`plugins/\` with the Git, SVN, archive, trash, Office, media, archive-preview, CSV, hex-preview and subdirectory-search plugins and the platform's search-index connector (Windows Search, Spotlight, or Tracker and Baloo), the GStreamer runtime on macOS and Windows (Linux uses the system's: install the gstreamer1.0 plug-in packages for playback), LICENSE, README, CHANGELOG and THIRD-PARTY-LICENSES; \`SHA256SUMS.txt\` has the checksums. Not signed or notarised (see README, Try it)."
          } >> body.md
          cat body.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Rick ${{ env.TAG }}
          body_path: body.md
          draft: ${{ contains(env.TAG, '-') || github.event_name == 'workflow_dispatch' }}
          prerelease: ${{ contains(env.TAG, '-') }}
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
