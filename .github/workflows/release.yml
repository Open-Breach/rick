name: release
# On a `v*` tag: a release build on every OS, one archive per platform with
# the bundle `cargo xtask bundle --release` lays out — the binary, the kernel
# dylibs and libstd it shares with the plugins, the pdfium library beside it
# (SPEC.md: pdfium ships beside the binary), the GStreamer runtime on macOS
# and Windows (SPEC.md: bundled there, the system's on Linux; QUESTIONS.md
# 89), the Visual C++ runtime on Windows (every module imports it, and a
# machine without the Visual C++ Redistributable has none), `plugins/` with
# every plugin (QUESTIONS.md 81) and the 7-Zip library
# with its licence beside the archive plugin (issue 51; built from the
# pinned sources on Linux and macOS, the pinned installer's 7z.dll on
# Windows, see .github/scripts/sevenzip.sh) — plus LICENSE, README,
# CHANGELOG and the third-party licences, as THIRD-PARTY-LICENSES.md at the
# root and as third-party.json beside the binary, the component list the
# About dialog shows (specs/about-dialog.md; issue 101), and on Linux the
# desktop entry and the icons under share/ in
# the XDG layout (specs/app-icons.md); on macOS the bundle goes into
# Rick.app (Contents/MacOS/ with the plugins beside the binary as
# everywhere, Info.plist from packaging/macos/ with the version filled in,
# Resources/Rick.icns) and the archive is the folder with Rick.app and the
# texts, zipped with ditto; a smoke test of every archive; then a GitHub Release with the archives, their
# SHA-256 sums and the tag's changelog section as its body. A tag with a
# pre-release suffix (v0.1.0-rc1) makes a draft pre-release; a plain tag
# publishes. Run by hand from a branch with a tag name, it is a dry run: the
# same build and smoke test, then a draft release under that name on the
# branch's commit (the tag itself is only created if the draft is published).
# No signing, notarisation or installers in 0.1.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release as this tag (vX.Y.Z or vX.Y.Z-rcN); a draft is created"
        required: true
permissions:
  contents: write
env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}
  # The GStreamer release whose official macOS and Windows packages the
  # archives bundle; Linux builds against the system packages.
  GSTREAMER_VERSION: "1.28.8"
jobs:
  licenses:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-about }
      # about.toml lists the four release targets, so one run covers them
      # all; the features are the release build's, so the GStreamer
      # bindings the media previewer plays through are in the list. Twice:
      # the Markdown for the archive's root and the JSON the About dialog
      # reads (about-json.hbs). The release fails here when the JSON is
      # missing or malformed, when a crate the release links on any of its
      # targets is not in it, or when it names a crate Cargo.lock does not
      # have (specs/about-dialog.md, Generation; QUESTIONS.md 261).
      - run: cargo about generate --features ext-preview-media/gstreamer about.hbs -o THIRD-PARTY-LICENSES.md
      - run: cargo about generate --features ext-preview-media/gstreamer about-json.hbs -o third-party.json
      - run: python3 .github/scripts/check-third-party.py third-party.json --features ext-preview-media/gstreamer
      - uses: actions/upload-artifact@v4
        with:
          name: third-party-licenses
          path: |
            THIRD-PARTY-LICENSES.md
            third-party.json
          if-no-files-found: error

  build:
    needs: licenses
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, platform: linux-x64, pdfium: pdfium-linux-x64 }
          # aarch64 Linux builds natively on GitHub's arm runner, no cross
          # toolchain needed.
          - { os: ubuntu-24.04-arm, platform: linux-arm64, pdfium: pdfium-linux-arm64 }
          - { os: macos-latest, platform: macos-arm64, pdfium: pdfium-mac-arm64 }
          - { os: windows-latest, platform: windows-x64, pdfium: pdfium-win-x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      # The whole history: crates/rick/build.rs writes the names of `git
      # shortlog` into the binary for the About dialog's credits, and a
      # shallow clone would name one person.
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # GStreamer for the media previewer (issue 18). Linux: the system
      # packages, development files for the build and the codec plug-ins
      # for the smoke test; the archive relies on the user's GStreamer.
      # macOS and Windows: the official runtime and development packages,
      # installed where their installers put them; the runtime is copied
      # into the bundle (RICK_GSTREAMER_DIR, QUESTIONS.md 106). The new
      # Windows installer is one Inno Setup executable per architecture.
      - name: gstreamer (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly gstreamer1.0-libav
      - name: gstreamer (macos)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          base="https://gstreamer.freedesktop.org/data/pkg/osx/$GSTREAMER_VERSION"
          # The packages are large and the server cuts a transfer short
          # now and then (release.yml run 42664667120): HTTP/1.1, and five
          # tries with a pause between them.
          for pkg in gstreamer-1.0 gstreamer-1.0-devel; do
            curl -sSL --http1.1 --retry 5 --retry-all-errors --retry-delay 15 \
              -o "$RUNNER_TEMP/$pkg.pkg" "$base/$pkg-$GSTREAMER_VERSION-universal.pkg"
            sudo installer -pkg "$RUNNER_TEMP/$pkg.pkg" -target /
          done
          framework="/Library/Frameworks/GStreamer.framework/Versions/1.0"
          echo "PKG_CONFIG_PATH=$framework/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "RICK_GSTREAMER_DIR=$framework" >> "$GITHUB_ENV"
          echo "$framework/bin" >> "$GITHUB_PATH"
      - name: gstreamer (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $base = "https://gstreamer.freedesktop.org/data/pkg/windows/$env:GSTREAMER_VERSION/msvc"
          $installer = "$env:RUNNER_TEMP\gstreamer.exe"
          # The installer is large and the server cuts a transfer short now
          # and then (release.yml run 42664667120); Invoke-WebRequest retries
          # error codes only, not a response that ends early, so curl does
          # the download: HTTP/1.1, five tries with a pause between them.
          curl.exe -sSL --http1.1 --retry 5 --retry-all-errors --retry-delay 15 -o $installer "$base/gstreamer-1.0-msvc-x86_64-$env:GSTREAMER_VERSION.exe"
          if ($LASTEXITCODE -ne 0) { throw "the GStreamer installer did not download (curl exit $LASTEXITCODE)" }
          $root = "C:\gstreamer\1.0\msvc_x86_64"
          Start-Process -FilePath $installer -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/TYPE=full", "/DIR=$root" -Wait
          if (-not (Test-Path "$root\lib\pkgconfig\gstreamer-1.0.pc")) {
            Get-ChildItem $root -Recurse -Depth 2 | Select-Object -First 50 FullName
            throw "the GStreamer installer did not put the development files under $root"
          }
          "PKG_CONFIG_PATH=$root\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RICK_GSTREAMER_DIR=$root" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$root\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      # The version is the tag's; its release part must be the workspace's,
      # so `rick --version` and the archive name agree. During a cycle the
      # workspace carries a `-dev` suffix, which a dry run may keep.
      - name: version
        shell: bash
        run: |
          tag_version="${TAG#v}"
          crate_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          if [ "${tag_version%%-*}" != "${crate_version%%-*}" ]; then
            echo "tag $TAG does not match workspace version $crate_version"
            exit 1
          fi
          echo "VERSION=$tag_version" >> "$GITHUB_ENV"
          echo "NAME=rick-$tag_version-${{ matrix.platform }}" >> "$GITHUB_ENV"
      - name: pdfium
        shell: bash
        run: |
          dest="$RUNNER_TEMP/pdfium"
          if [ "${{ runner.os }}" = "Windows" ]; then
            dest="$(cygpath -u "$RUNNER_TEMP")/pdfium"
          fi
          mkdir -p "$dest"
          curl -sSL "https://github.com/bblanchon/pdfium-binaries/releases/latest/download/${{ matrix.pdfium }}.tgz" | tar xz -C "$dest"
          # The library's path goes into the PDF previewer's setting file in
          # the runner's config directory, which `cargo xtask bundle` reads
          # to copy the library beside the binary (issue 50: no environment
          # variable names it any more).
          if [ "${{ runner.os }}" = "Windows" ]; then
            lib="$dest/bin/pdfium.dll"; config="$(cygpath -u "$APPDATA")/Rick"; lib_setting="$(cygpath -m "$lib")"
          elif [ "${{ runner.os }}" = "macOS" ]; then
            lib="$dest/lib/libpdfium.dylib"; config="$HOME/Library/Application Support/Rick"; lib_setting="$lib"
          else
            lib="$dest/lib/libpdfium.so"; config="${XDG_CONFIG_HOME:-$HOME/.config}/rick"; lib_setting="$lib"
          fi
          echo "PDFIUM_LIB=$lib" >> "$GITHUB_ENV"
          mkdir -p "$config"
          printf 'library = "%s"\n' "$lib_setting" > "$config/preview-pdf.toml"
      # The 7-Zip library for the disk images (issue 51): 7z.so built from
      # the pinned sources on Linux and macOS, 7z.dll from the pinned
      # installer on Windows, with the licence text beside it.
      - name: 7-zip library
        shell: bash
        env: { SEVENZIP_SOURCE: build }
        run: |
          dest="$RUNNER_TEMP/sevenzip"
          if [ "${{ runner.os }}" = "Windows" ]; then dest="$(cygpath -u "$RUNNER_TEMP")/sevenzip"; fi
          .github/scripts/sevenzip.sh "$dest"
          if [ "${{ runner.os }}" = "Windows" ]; then
            echo "RICK_SEVENZIP_DIR=$(cygpath -w "$dest")" >> "$GITHUB_ENV"
          else
            echo "RICK_SEVENZIP_DIR=$dest" >> "$GITHUB_ENV"
          fi
      # The Visual C++ runtime: rick.exe, the kernel libraries, every plugin
      # and the GStreamer runtime import vcruntime140.dll, some of them
      # vcruntime140_1.dll and msvcp140.dll too, and the 0.3.0 archive, which
      # carried none, did not start on a machine without the Visual C++
      # Redistributable. The redistributable folder of the newest toolset of
      # the runner's Visual Studio, the one the build links with, is named
      # to the bundler, which copies its libraries beside the binary.
      - name: visual c++ runtime (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $install = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $install) { throw "no Visual Studio with the C++ tools on this runner" }
          $redist = Join-Path $install "VC\Redist\MSVC"
          $crt = Get-ChildItem -Path $redist -Directory |
            Where-Object { $_.Name -match '^\d+(\.\d+)+$' } |
            Sort-Object { [version]$_.Name } -Descending |
            ForEach-Object { Get-ChildItem -Path (Join-Path $_.FullName "x64") -Directory -Filter "Microsoft.VC*.CRT" -ErrorAction SilentlyContinue } |
            Where-Object { Test-Path (Join-Path $_.FullName "vcruntime140.dll") } |
            Select-Object -First 1
          if (-not $crt) {
            Get-ChildItem -Path $redist -Recurse -Depth 2 | Select-Object -First 60 FullName
            throw "no Microsoft.VC*.CRT folder with vcruntime140.dll under $redist"
          }
          Get-ChildItem -Path $crt.FullName | Select-Object Name, Length
          "RICK_VCRUNTIME_DIR=$($crt.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
      # The bundle: binary, kernel dylibs, libstd, pdfium (from the PDF
      # previewer's setting), the GStreamer runtime (from RICK_GSTREAMER_DIR on
      # macOS and Windows), the Visual C++ runtime (from RICK_VCRUNTIME_DIR on
      # Windows), plugins/ with the 7-Zip library beside the
      # archive plugin (from RICK_SEVENZIP_DIR), from one build of every library,
      # binary and example in the workspace with the media previewer's
      # playback on, the previewer's pdfium_check example for the smoke
      # test among them.
      - run: cargo xtask bundle --release --features ext-preview-media/gstreamer
      # The official macOS libraries are universal; the archive is for
      # Apple silicon, so the other half goes.
      - name: thin the gstreamer libraries
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          find target/release/bundle/gstreamer -type f \( -name '*.dylib' -o -name 'gst-plugin-scanner' \) | while read -r file; do
            if lipo -info "$file" 2>/dev/null | grep -q "arm64"; then
              lipo -thin arm64 "$file" -output "$file.thin" 2>/dev/null && mv "$file.thin" "$file" || true
            fi
          done
          du -sh target/release/bundle/gstreamer
      - uses: actions/download-artifact@v4
        with: { name: third-party-licenses }
      - name: package
        shell: bash
        run: |
          set -euo pipefail
          exe=""
          if [ "${{ runner.os }}" = "Windows" ]; then exe=".exe"; fi
          mkdir -p "dist/$NAME"
          # macOS: Rick.app (specs/app-icons.md). Contents/MacOS holds the
          # whole bundle — the binary, the kernel dylibs and libstd, pdfium,
          # the GStreamer runtime and plugins/, as the binary's run path and
          # the plugin lookup expect them beside it; Info.plist comes from
          # the template with the release's version (the tag's release
          # part as the short version, the whole tag as the build version);
          # the icon set is the committed .icns. The texts sit beside the
          # bundle in the archive's folder.
          if [ "${{ runner.os }}" = "macOS" ]; then
            app="dist/$NAME/Rick.app/Contents"
            mkdir -p "$app/MacOS" "$app/Resources"
            cp -R target/release/bundle/. "$app/MacOS/"
            cp assets/icons/macos/Rick.icns "$app/Resources/Rick.icns"
            sed -e "s/@SHORT_VERSION@/${VERSION%%-*}/g" -e "s/@VERSION@/$VERSION/g" packaging/macos/Info.plist > "$app/Info.plist"
            plutil -lint "$app/Info.plist"
            bin="$app/MacOS"
          else
            cp -R target/release/bundle/. "dist/$NAME/"
            bin="dist/$NAME"
          fi
          cp LICENSE README.md CHANGELOG.md THIRD-PARTY-LICENSES.md "dist/$NAME/"
          # The component list the About dialog reads at start: beside the
          # binary, on macOS in the bundle's Resources
          # (specs/about-dialog.md, Generation).
          if [ "${{ runner.os }}" = "macOS" ]; then
            cp third-party.json "$app/Resources/third-party.json"
          else
            cp third-party.json "$bin/third-party.json"
          fi
          # Linux: the desktop entry and the icons in the XDG layout under
          # share/ (specs/app-icons.md), so that one copy of share/ into
          # ~/.local/share installs them and the installer plugin finds them
          # where it looks.
          if [ "${{ runner.os }}" = "Linux" ]; then
            mkdir -p "dist/$NAME/share/applications" "dist/$NAME/share/icons"
            cp packaging/linux/rick.desktop "dist/$NAME/share/applications/"
            cp -R assets/icons/linux/hicolor "dist/$NAME/share/icons/"
            # The polkit action of the ZFS plugin's helper rick-zfs, for a
            # system-wide install (QUESTIONS.md 366).
            mkdir -p "dist/$NAME/share/polkit-1/actions"
            cp packaging/linux/org.openbreach.rick.zfs.policy "dist/$NAME/share/polkit-1/actions/"
          fi
          # The 7-Zip licence among the licences at the root as well as
          # beside the library.
          cp "$bin/plugins/vfs-archive/7-Zip-License.txt" "dist/$NAME/7-Zip-License.txt"
          ls -lR "dist/$NAME"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip "$NAME.zip" "$NAME" > /dev/null
            archive="$NAME.zip"
          elif [ "${{ runner.os }}" = "macOS" ]; then
            # ditto keeps the bundle's permissions and attributes, as
            # Finder's own Compress does.
            ditto -c -k --keepParent "$NAME" "$NAME.zip"
            archive="$NAME.zip"
          else
            tar czf "$NAME.tar.gz" "$NAME"
            archive="$NAME.tar.gz"
          fi
          if command -v sha256sum > /dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          cat "$archive.sha256"
          rm -r "$NAME"
          mkdir -p ../check
          cp "../target/release/examples/pdfium_check$exe" ../check/
      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: pdfium-check-${{ matrix.platform }}
          path: check/
          if-no-files-found: error

  # Each archive, as a user gets it: unpacked in an empty directory, the
  # binary reports its version, lists every plugin of the platform as
  # loaded, and pdfium loads from beside it.
  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, platform: linux-x64 }
          - { os: ubuntu-24.04-arm, platform: linux-arm64 }
          - { os: macos-latest, platform: macos-arm64 }
          - { os: windows-latest, platform: windows-x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      # For .github/scripts/check-plugins.sh, the per-platform plugin check.
      - uses: actions/checkout@v4
      # The Linux archives use the system GStreamer: the media plugin links
      # it and loads only where it is installed, as a user's desktop has it.
      - name: gstreamer and desktop-file-utils (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgstreamer1.0-0 libgstreamer-plugins-base1.0-0 gstreamer1.0-plugins-good desktop-file-utils
      - uses: actions/download-artifact@v4
        with: { name: "archive-${{ matrix.platform }}", path: dist }
      - uses: actions/download-artifact@v4
        with: { name: "pdfium-check-${{ matrix.platform }}", path: check }
      - name: smoke test
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG#v}"
          name="rick-$version-${{ matrix.platform }}"
          exe=""
          if [ "${{ runner.os }}" = "Windows" ]; then exe=".exe"; fi
          cd dist
          if command -v sha256sum > /dev/null; then sha256sum -c "$name".*.sha256; else shasum -a 256 -c "$name".*.sha256; fi
          mkdir empty && cd empty
          case "${{ runner.os }}" in
            Windows) 7z x "../$name.zip" > /dev/null ;;
            macOS) ditto -x -k "../$name.zip" . ;;
            *) tar xzf "../$name.tar.gz" ;;
          esac
          cd "$name"
          ls -l
          for file in LICENSE README.md CHANGELOG.md THIRD-PARTY-LICENSES.md 7-Zip-License.txt; do
            test -f "$file" || { echo "missing $file"; exit 1; }
          done
          # macOS: the bundle (specs/app-icons.md) — a valid Info.plist
          # naming the binary and the icon, the icon set, and the binary
          # with everything beside it in Contents/MacOS, where the checks
          # below look.
          if [ "${{ runner.os }}" = "macOS" ]; then
            plist=Rick.app/Contents/Info.plist
            plutil -lint "$plist"
            for key in CFBundleIdentifier CFBundleExecutable CFBundleIconFile CFBundleShortVersionString CFBundleVersion; do
              echo "$key = $(/usr/libexec/PlistBuddy -c "Print :$key" "$plist")"
            done
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")" = "org.open-breach.rick" || { echo "wrong bundle identifier"; exit 1; }
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$plist")" = "rick" || { echo "wrong bundle executable"; exit 1; }
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$plist")" = "Rick" || { echo "wrong bundle icon"; exit 1; }
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")" = "$version" || { echo "wrong bundle version"; exit 1; }
            test -f Rick.app/Contents/Resources/Rick.icns || { echo "no Rick.icns in the bundle"; exit 1; }
            cmp Rick.app/Contents/Resources/Rick.icns "$GITHUB_WORKSPACE/assets/icons/macos/Rick.icns" || { echo "Rick.icns is not the committed one"; exit 1; }
            test -d Rick.app/Contents/MacOS/plugins || { echo "no plugins/ beside the binary in the bundle"; exit 1; }
            test -f Rick.app/Contents/Resources/third-party.json || { echo "no third-party.json in the bundle's Resources"; exit 1; }
            cd Rick.app/Contents/MacOS
            ls -l
          else
            test -f third-party.json || { echo "no third-party.json beside the binary"; exit 1; }
          fi
          test -f "rick$exe" || { echo "missing rick$exe"; exit 1; }
          # The About dialog's component list parses and names crates. Read as
          # UTF-8: the licence texts are not in Windows' default code page.
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1], encoding="utf-8")); assert isinstance(d,list) and len(d) > 100, "too few entries"; print(len(d), "third-party entries")' \
            "$([ "${{ runner.os }}" = "macOS" ] && echo ../Resources/third-party.json || echo third-party.json)"
          test -f libpdfium.so || test -f libpdfium.dylib || test -f pdfium.dll || { echo "no pdfium library beside the binary"; exit 1; }
          # The GStreamer runtime the media previewer plays through, bundled
          # on macOS and Windows (QUESTIONS.md 106).
          case "${{ runner.os }}" in
            macOS) test -f gstreamer/lib/libgstreamer-1.0.0.dylib || { echo "no bundled GStreamer"; exit 1; }
                   ls gstreamer/lib/gstreamer-1.0 | head -5 ;;
            Windows) test -f gstreamer-1.0-0.dll || { echo "no bundled GStreamer"; exit 1; }
                     ls gstreamer-1.0 | head -5 ;;
          esac
          # Linux: the desktop entry and the icons under share/
          # (specs/app-icons.md): the entry valid and naming the app id
          # `rick` as its icon and its StartupWMClass, and every file of
          # the repository's hicolor set at its place.
          if [ "${{ runner.os }}" = "Linux" ]; then
            desktop-file-validate share/applications/rick.desktop
            grep -qx 'Icon=rick' share/applications/rick.desktop || { echo "the desktop entry's Icon is not rick"; exit 1; }
            grep -qx 'StartupWMClass=rick' share/applications/rick.desktop || { echo "the desktop entry's StartupWMClass is not rick"; exit 1; }
            diff <(cd "$GITHUB_WORKSPACE/assets/icons/linux/hicolor" && find . -type f | sort) <(cd share/icons/hicolor && find . -type f | sort) \
              || { echo "the icons under share/ are not the repository's hicolor set"; exit 1; }
            test -f share/icons/hicolor/scalable/apps/rick.svg || { echo "no scalable icon"; exit 1; }
            find share -type f | sort
          fi
          # The kernel dylibs and libstd the binary shares with the plugins.
          ls -1 | grep -Eq '^(lib)?std-' || { echo "no libstd beside the binary"; exit 1; }
          ls -1 | grep -Eq '^(lib)?ext\.' || { echo "no ext library beside the binary"; exit 1; }
          # The version text, the About dialog's details
          # (specs/about-dialog.md): the first line the name and the
          # workspace version (the tag without any pre-release suffix, a
          # `-dev` workspace keeps its suffix), the second the build line
          # with the short commit, this OS and architecture, the plugin ABI
          # and the build date; then the toolchain, the OS, and one line
          # per plugin.
          out="$("./rick$exe" --version)"
          echo "rick --version:"; echo "$out"
          printf '%s\n' "$out" | sed -n 1p | grep -Eq "^Rick ${version%%-*}(-[0-9A-Za-z.]+)?$" || { echo "unexpected version line"; exit 1; }
          printf '%s\n' "$out" | sed -n 2p | grep -Eq "^[0-9a-f]{7,} · (Linux|macOS|Windows) [a-z0-9_]+ · plugin ABI [0-9]+ · built [0-9]{4}-[0-9]{2}-[0-9]{2}$" || { echo "unexpected build line"; exit 1; }
          printf '%s\n' "$out" | sed -n 3p | grep -q "^rustc " || { echo "no toolchain line"; exit 1; }
          printf '%s\n' "$out" | grep -Eq "^git [0-9][^ ]* loaded$" || { echo "the git plugin is not listed as loaded"; exit 1; }
          # The plugins, bundled and loaded from plugins/<id>/: Git and SVN,
          # the archive and trash providers of issue 20, the previewers of
          # issue 18 and the markup previewer of issue 51, the hex fallback
          # of issue 17, the subdirectory search and this platform's index
          # connector of issue 22; and the 7-Zip library with its licence
          # beside the archive plugin (issue 51). The media previewer
          # loading on macOS and Windows shows the bundled GStreamer runtime
          # resolves; on Linux the runner's system GStreamer does.
          "$GITHUB_WORKSPACE/.github/scripts/check-plugins.sh" . --sevenzip
          # pdfium from beside the binary: the previewer's test binary, copied
          # next to rick, with no setting (a fresh runner) and no system
          # pdfium. The example has no run path of its own, so the library
          # path names the directory for the kernel dylibs and libstd.
          if [ "${{ runner.os }}" = "macOS" ]; then
            cp "../../../../../../check/pdfium_check$exe" .
          else
            cp "../../../check/pdfium_check$exe" .
          fi
          chmod +x "pdfium_check$exe"
          LD_LIBRARY_PATH=. DYLD_LIBRARY_PATH=. "./pdfium_check$exe" | tee check.txt
          grep -q "^pdfium ok" check.txt
          # Windows: the icon and version resource of rick.exe
          # (specs/app-icons.md), as Explorer's Properties dialog reads it.
          if [ "${{ runner.os }}" = "Windows" ]; then
            pwsh -NoProfile -File "$GITHUB_WORKSPACE/.github/scripts/check-exe-resource.ps1" rick.exe "$version"
            # The Visual C++ runtime beside rick.exe: every library of it
            # that a module of the archive imports is in the archive. The
            # import tables are read from the files, since this runner has
            # Visual Studio and rick.exe starting here proves nothing.
            python3 "$GITHUB_WORKSPACE/.github/scripts/check-vcruntime.py" .
          fi

  release:
    needs: [build, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: "archive-*", path: dist, merge-multiple: true }
      - name: checksums and body
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          cat ./*.sha256 | sort -k2 > SHA256SUMS.txt
          rm ./*.sha256
          cat SHA256SUMS.txt
          cd ..
          python3 .github/scripts/changelog-section.py "$TAG" CHANGELOG.md > body.md
          {
            echo
            echo "Archives: the \`rick\` binary with the shared kernel libraries, libstd and the pdfium library beside it, \`plugins/\` with the Git, SVN, archive, trash, Office, media, archive-preview, markup (Markdown, HTML, CSV), hex-preview and subdirectory-search plugins and the platform's search-index connector (Windows Search, Spotlight, or Tracker and Baloo), the 7-Zip library (LGPL) beside the archive plugin for the disk images, the GStreamer runtime on macOS and Windows (Linux uses the system's: install the gstreamer1.0 plug-in packages for playback), on Linux the desktop entry and the icons under \`share/\` in the XDG layout (copy \`share/\` into \`~/.local/share/\` and put \`rick\` on the PATH, or install the tarball with Rick's installer plugin), on macOS all of it inside \`Rick.app\` (drag it to Applications), LICENSE, README, CHANGELOG, THIRD-PARTY-LICENSES, the 7-Zip licence and \`third-party.json\` beside the binary (the component list the About dialog shows); \`SHA256SUMS.txt\` has the checksums. Not signed or notarised (see README, Try it)."
          } >> body.md
          cat body.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Rick ${{ env.TAG }}
          body_path: body.md
          draft: ${{ contains(env.TAG, '-') || github.event_name == 'workflow_dispatch' }}
          prerelease: ${{ contains(env.TAG, '-') }}
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
