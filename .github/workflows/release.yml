name: release
# On a `v*` tag: a release build for every platform. macOS and Windows are
# built here, one archive each. Linux is built by Trebuchet's reusable
# workflow linux-packages.yml (Open-Breach/trebuchet), which the `linux` job
# calls: for every distribution release of its target list and for x86-64
# and arm64 it runs .github/scripts/linux-package.sh inside that release's
# container and makes a deb or an rpm of the result, with one more for each
# separate plugin, rick-plugin-<id>, and rick-plugins for all of them; and
# one build per architecture is also the archive,
# rick-<version>-linux-<arch>.tar.gz, with the plugin packages that fit it.
# What follows describes an archive, with
# the bundle `cargo xtask bundle --release` lays out — the binary, the kernel
# dylibs and libstd it shares with the plugins, the pdfium library beside it
# (SPEC.md: pdfium ships beside the binary), the Visual C++ runtime on
# Windows (every module imports it, and a machine without the Visual C++
# Redistributable has none), `plugins/` with the default set of plugins
# (specs/plugin-distribution.md §4) and the 7-Zip library
# with its licence beside the archive plugin (issue 51; built from the
# pinned sources on Linux and macOS, the pinned installer's 7z.dll on
# Windows, see .github/scripts/sevenzip.sh) — plus LICENSE, README,
# CHANGELOG and the third-party licences, as THIRD-PARTY-LICENSES.md at the
# root (the crates of Cargo.lock, then the components shipped outside Cargo
# from about/bundled.toml) and as third-party.json beside the binary, the
# component list the About dialog shows (specs/about-dialog.md; issue 101),
# licenses/ with the texts pdfium and the standard library bring with them
# (`cargo xtask bundle` copies them), and on Linux the
# desktop entry and the icons under share/ in
# the XDG layout (specs/app-icons.md); on macOS the bundle goes into
# Rick.app (Contents/MacOS/ with the plugins beside the binary as
# everywhere, Info.plist from packaging/macos/ with the version filled in,
# Resources/Rick.icns) and the archive is the folder with Rick.app and the
# texts, zipped with ditto. The separate plugins are not in the archives:
# `cargo xtask package --release` makes one `<id>-<version>-<platform>.rkp`
# of each from the bundle and `plugins-<platform>.json`, the manifest the
# plugin registry's publisher reads, and their folders leave the tree
# before it is archived. On macOS and Windows the media plugin is one of
# them, with the GStreamer runtime in its folder, so those archives hold no
# GStreamer; on Linux it is in the archive and uses the system's. Then a
# smoke test of every archive and of its packages, and a GitHub Release with
# the archives, the packages and the manifests of the four platforms, their
# SHA-256 sums and the tag's changelog section as its body. The release is
# written as a draft, and a draft it stays until its files have verified
# (below): only then does the `publish` job make a plain tag's release
# public. A tag with a pre-release suffix (v0.1.0-rc1) stays a draft
# pre-release. Run by hand from a branch with a tag name, it is a dry run:
# the same build, smoke test and verification, then a draft release under
# that name on the branch's commit (the tag itself is only created if the
# draft is published). Leave the branch alone while a dry run is going:
# GitHub refuses the draft (HTTP 403, in the Linux job that attaches)
# where the run's commit is no longer the head of a branch and its
# workflow files are on none. No signing, notarisation or installers in
# 0.1.
#
# Every file of a release has a GitHub build attestation, made by the run
# that built it (specs/system-integration.md §9): Trebuchet's workflow
# attests the Linux files, this one the macOS and Windows archives, their
# plugin packages and lists, and the checksums. The `verify` job then
# checks files of the draft the way a user would, with
# `gh attestation verify`: a Linux package and the two archives must
# verify, and a copy with one byte changed must not. Where it fails, the
# release stays a draft and nothing is public. A dry run attests and
# verifies too: its files are real builds.
#
# The order is: build, attest, draft, verify, publish, and then the
# `repositories` job tells Trebuchet's publisher, which takes the deb and
# rpm files from the release page into the apt and dnf repositories on
# get.openbreach.dev. A pre-release and a dry run stay drafts and are not
# announced. Telling the publisher takes a token, the secret
# TREBUCHET_DISPATCH_TOKEN: a real release run looks for it first, before
# anything is built, and stops there if it is not set.
#
# Runners: the labels come from the repository variables RUNNER_LINUX_X64,
# RUNNER_LINUX_ARM64, RUNNER_MACOS and RUNNER_WINDOWS; where one is not
# set, the job runs on GitHub's runner of that platform. The Linux builds
# run where Trebuchet's workflow puts them: on Depot's runners in this
# organisation, on GitHub's in a fork, and on the labels of the two Linux
# variables where they are set.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release as this tag (vX.Y.Z or vX.Y.Z-rcN); a draft is created"
        required: true
permissions:
  contents: write
env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}
  # The GStreamer release whose official macOS and Windows packages the
  # archives bundle; Linux builds against the system packages.
  GSTREAMER_VERSION: "1.28.8"
jobs:
  licenses:
    runs-on: ${{ vars.RUNNER_LINUX_X64 || 'ubuntu-24.04' }}
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # A release ends by telling Trebuchet's publisher, with a token that
      # is a secret of this repository. Without it the release would be
      # built, verified and published, and the package repositories never
      # told. So a real release run looks for the token here, in the first
      # step of the job every other job waits for, and stops before
      # anything is built. A pre-release and a dry run tell nobody and need
      # none. That the token is set is all this can tell: whether it still
      # works shows when it is used.
      - name: the publisher's token
        if: github.event_name == 'push' && !contains(github.ref_name, '-')
        env:
          TREBUCHET_DISPATCH_TOKEN: ${{ secrets.TREBUCHET_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TREBUCHET_DISPATCH_TOKEN" ]; then
            message="The secret TREBUCHET_DISPATCH_TOKEN is not set. A release ends by telling Trebuchet's publisher with it (Open-Breach/trebuchet, docs/publisher.md). Nothing was built and nothing is published. Set the secret in this repository and run this workflow again."
            echo "::error::$message"
            { echo "### Stopped before the build"; echo; echo "$message"; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "TREBUCHET_DISPATCH_TOKEN is set"
      - uses: actions/checkout@v4
      # The version the Linux packages are made with: the tag's, whose
      # release part must be the workspace's, as the build job checks for
      # its own platforms.
      - name: version
        id: version
        run: |
          tag_version="${TAG#v}"
          crate_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          if [ "${tag_version%%-*}" != "${crate_version%%-*}" ]; then
            echo "tag $TAG does not match workspace version $crate_version"
            exit 1
          fi
          echo "version=$tag_version" >> "$GITHUB_OUTPUT"
      # The README the archives carry describes this release
      # (specs/readme.md): the version in its status line is the tag's.
      # First, so a release cut from a commit without its README stops
      # before anything is built.
      - run: .github/scripts/check-readme.sh "$TAG"
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-about }
      # about.toml lists the four release targets, so one run covers them
      # all; the features are the release build's, so the GStreamer
      # bindings the media previewer plays through are in the list. Twice:
      # the Markdown for the archive's root and the JSON the About dialog
      # reads (about-json.hbs). The release fails here when the JSON is
      # missing or malformed, when a crate the release links on any of its
      # targets is not in it, or when it names a crate Cargo.lock does not
      # have (specs/about-dialog.md, Generation; QUESTIONS.md 261).
      - run: cargo about generate --features ext-preview-media/gstreamer about.hbs -o THIRD-PARTY-LICENSES.md
      # cargo-about knows the crates. What ships outside Cargo — pdfium,
      # 7-Zip, GStreamer, the standard library, the fonts and the icon font
      # — follows from about/bundled.toml, so that the file names everything
      # a release carries and not only the About dialog does.
      - run: python3 .github/scripts/bundled-licenses.py about/bundled.toml >> THIRD-PARTY-LICENSES.md
      - run: cargo about generate --features ext-preview-media/gstreamer about-json.hbs -o third-party.json
      - run: python3 .github/scripts/check-third-party.py third-party.json --features ext-preview-media/gstreamer
      - uses: actions/upload-artifact@v4
        with:
          name: third-party-licenses
          path: |
            THIRD-PARTY-LICENSES.md
            third-party.json
          if-no-files-found: error

  # Linux: the deb and rpm packages of every target and the archive of each
  # architecture, built and smoke-tested by Trebuchet's workflow. It takes
  # the licence lists of the job above as its build artifact, runs
  # .github/scripts/linux-package.sh as the build, packages with the
  # metadata of crates/rick/Cargo.toml, installs each package in a fresh
  # container of its release and runs `rick --version` there. In that
  # container, which has the package's dependencies and nothing of the
  # build, it then runs .github/scripts/linux-smoke.sh: every plugin of the
  # package loads, pdfium opens a PDF, two videos play, and where the build
  # is also the archive its plugin packages install into the per-user
  # folder and load, for the package and once more for the unpacked
  # archive. What that script needs from the build, two test programs and
  # two videos, travels in the workflow's folder for the smoke test, which
  # no release sees. The call names the release tag, so the workflow
  # attests its release files and attaches them to the release of the tag,
  # a draft it makes where there is none yet; the release job below
  # finishes that release.
  # The dependencies are per distribution. To build: GStreamer's
  # development files, beyond a compiler, and its tools and plug-ins to
  # write the smoke test's videos, an H.264 encoder among them. To run, all
  # of them by name (crates/rick/Cargo.toml says why the tools do not find
  # them): what the binaries link — the C and C++ runtimes, GLib and
  # GStreamer — the GStreamer plug-in sets the media previewer plays
  # through, with a decoder for H.264 (the libav plug-in on Debian and
  # Ubuntu; on Fedora the OpenH264 plug-in and the parser it needs, from
  # the bad-free set), and the libraries the user interface loads by name
  # once it opens a window, for X11 and for Wayland, with Vulkan and EGL to
  # draw with.
  linux:
    needs: licenses
    # contents: write to attach to the release; the other two for the
    # build attestations, which a called workflow cannot grant itself.
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: Open-Breach/trebuchet/.github/workflows/linux-packages.yml@main
    with:
      app: rick
      version: ${{ needs.licenses.outputs.version }}
      build-artifact: third-party-licenses
      build-command: .github/scripts/linux-package.sh
      smoke-command: .github/scripts/linux-smoke.sh
      release-tag: ${{ inputs.tag || github.ref_name }}
      bundle-dir: target/release/bundle
      desktop-file: packaging/linux/rick.desktop
      icon: assets/icons/linux/hicolor
      # The separate plugins as packages of their own, `rick-plugin-<id>`
      # (specs/plugin-distribution.md §2, decision 5, and §4): the nine of
      # Linux, each from the folder linux-package.sh takes out of the
      # bundle, installed beside the binary's other plugins and pinned to
      # the `rick` package of exactly this version. `rick-plugins` is all
      # of them. The summary is what `apt show` and `dnf info` print.
      plugins-dir: /usr/lib/rick/plugins
      plugins: |
        [
          { "id": "git", "summary": "Git for the Rick file manager: status badges, the branch and the Git actions",
            "files": "target/release/plugin-packages/git" },
          { "id": "svn", "summary": "Subversion for the Rick file manager: status badges and the SVN actions",
            "files": "target/release/plugin-packages/svn" },
          { "id": "zfs", "summary": "ZFS for the Rick file manager: snapshots, file versions and restore",
            "files": "target/release/plugin-packages/zfs" },
          { "id": "ssh", "summary": "SSH for the Rick file manager: remote hosts as locations",
            "files": "target/release/plugin-packages/ssh" },
          { "id": "vfs-s3", "summary": "S3 for the Rick file manager: Amazon S3 and compatible stores as locations",
            "files": "target/release/plugin-packages/vfs-s3" },
          { "id": "vfs-azure", "summary": "Azure Blob for the Rick file manager: storage accounts as locations",
            "files": "target/release/plugin-packages/vfs-azure" },
          { "id": "vfs-gcs", "summary": "Google Cloud Storage for the Rick file manager: projects as locations",
            "files": "target/release/plugin-packages/vfs-gcs" },
          { "id": "preview-office", "summary": "Office documents in the preview of the Rick file manager",
            "files": "target/release/plugin-packages/preview-office" },
          { "id": "preview-3d", "summary": "3D models in the preview of the Rick file manager",
            "files": "target/release/plugin-packages/preview-3d" }
        ]
      build-deps: |
        {
          "debian": [
            "libgstreamer1.0-dev", "libgstreamer-plugins-base1.0-dev",
            "gstreamer1.0-tools", "gstreamer1.0-plugins-base", "gstreamer1.0-plugins-good",
            "gstreamer1.0-plugins-ugly"
          ],
          "ubuntu": [
            "libgstreamer1.0-dev", "libgstreamer-plugins-base1.0-dev",
            "gstreamer1.0-tools", "gstreamer1.0-plugins-base", "gstreamer1.0-plugins-good",
            "gstreamer1.0-plugins-ugly"
          ],
          "fedora": [
            "gstreamer1-devel", "gstreamer1-plugins-base-devel",
            "gstreamer1", "gstreamer1-plugins-base", "gstreamer1-plugins-good",
            "gstreamer1-plugin-openh264", "gstreamer1-plugins-bad-free"
          ]
        }
      runtime-deps: |
        {
          "debian": [
            "libc6", "libgcc-s1", "libstdc++6", "libglib2.0-0",
            "libgstreamer1.0-0", "libgstreamer-plugins-base1.0-0",
            "gstreamer1.0-plugins-base", "gstreamer1.0-plugins-good", "gstreamer1.0-libav",
            "libxkbcommon0", "libxkbcommon-x11-0", "libwayland-client0", "libwayland-egl1",
            "libxcb1", "libx11-6", "libx11-xcb1", "libxcursor1", "libxi6",
            "libvulkan1", "libegl1"
          ],
          "ubuntu": [
            "libc6", "libgcc-s1", "libstdc++6", "libglib2.0-0",
            "libgstreamer1.0-0", "libgstreamer-plugins-base1.0-0",
            "gstreamer1.0-plugins-base", "gstreamer1.0-plugins-good", "gstreamer1.0-libav",
            "libxkbcommon0", "libxkbcommon-x11-0", "libwayland-client0", "libwayland-egl1",
            "libxcb1", "libx11-6", "libx11-xcb1", "libxcursor1", "libxi6",
            "libvulkan1", "libegl1"
          ],
          "fedora": [
            "glibc", "libgcc", "libstdc++", "glib2",
            "gstreamer1", "gstreamer1-plugins-base", "gstreamer1-plugins-good",
            "gstreamer1-plugin-openh264", "gstreamer1-plugins-bad-free",
            "libxkbcommon", "libxkbcommon-x11", "libwayland-client", "libwayland-egl",
            "libxcb", "libX11", "libX11-xcb", "libXcursor", "libXi",
            "vulkan-loader", "libglvnd-egl"
          ]
        }

  build:
    needs: licenses
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux is the `linux` job's. The steps and branches below that
          # are for Linux no longer run from this matrix.
          - { os: "${{ vars.RUNNER_MACOS || 'macos-latest' }}", platform: macos-arm64, pdfium: pdfium-mac-arm64 }
          - { os: "${{ vars.RUNNER_WINDOWS || 'windows-latest' }}", platform: windows-x64, pdfium: pdfium-win-x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # Reading is all the build needs of the repository; the other two are
    # for the build attestations of what it makes.
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      # The whole history: crates/rick/build.rs writes the names of `git
      # shortlog` into the binary for the About dialog's credits, and a
      # shallow clone would name one person.
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      # GStreamer for the media previewer (issue 18). Linux: the system
      # packages, development files for the build, the codec plug-ins and
      # the tools for the sample the smoke test plays; the archive relies
      # on the user's GStreamer.
      # macOS and Windows: the official runtime and development packages,
      # installed where their installers put them; the runtime is copied
      # into the bundle (RICK_GSTREAMER_DIR, QUESTIONS.md 106). The new
      # Windows installer is one Inno Setup executable per architecture.
      - name: gstreamer (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly gstreamer1.0-libav gstreamer1.0-tools
      # The downloaded packages are cached per GStreamer release: about
      # 920 MB on macOS and 520 MB on Windows, from a server that is slow
      # and cuts transfers short. A tag run's own cache
      # is visible to that tag only, so deps-cache.yml fills the cache from
      # main, where every tag and branch finds it; its cache steps and
      # downloads are these, and the two files change together.
      - name: gstreamer packages cache (macos)
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/gstreamer-pkgs
          key: gstreamer-${{ env.GSTREAMER_VERSION }}-macos-universal
      - name: gstreamer (macos)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          base="https://gstreamer.freedesktop.org/data/pkg/osx/$GSTREAMER_VERSION"
          pkgs="$RUNNER_TEMP/gstreamer-pkgs"
          mkdir -p "$pkgs"
          # A package the cache restored is not downloaded again. The
          # packages are large and the server cuts a transfer short
          # now and then (release.yml runs 42664667120 and 43014231048):
          # HTTP/1.1, and five retries with a pause between them. A retry
          # resumes the partial download (`-C -`). The loop does the
          # retrying, not curl's --retry, which removes what the failed
          # try wrote and starts again from byte zero, `-C -` or not.
          for pkg in gstreamer-1.0 gstreamer-1.0-devel; do
            if [ -f "$pkgs/$pkg.pkg" ]; then
              echo "$pkg.pkg is in the cache, no download"
            else
              try=0
              until curl -sSL --http1.1 -C - \
                -o "$pkgs/$pkg.pkg" "$base/$pkg-$GSTREAMER_VERSION-universal.pkg"; do
                try=$((try + 1))
                if [ "$try" -gt 5 ]; then
                  echo "$pkg did not download in five retries"
                  exit 1
                fi
                sleep 15
              done
            fi
            sudo installer -pkg "$pkgs/$pkg.pkg" -target /
          done
          framework="/Library/Frameworks/GStreamer.framework/Versions/1.0"
          echo "PKG_CONFIG_PATH=$framework/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "RICK_GSTREAMER_DIR=$framework" >> "$GITHUB_ENV"
          echo "$framework/bin" >> "$GITHUB_PATH"
      - name: gstreamer packages cache (windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\gstreamer-pkgs
          key: gstreamer-${{ env.GSTREAMER_VERSION }}-windows-msvc-x86_64
      - name: gstreamer (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $base = "https://gstreamer.freedesktop.org/data/pkg/windows/$env:GSTREAMER_VERSION/msvc"
          $pkgs = "$env:RUNNER_TEMP\gstreamer-pkgs"
          $installer = "$pkgs\gstreamer.exe"
          New-Item -ItemType Directory -Force -Path $pkgs | Out-Null
          # An installer the cache restored is not downloaded again.
          # The installer is large and the server cuts a transfer short now
          # and then (release.yml run 42664667120); Invoke-WebRequest retries
          # error codes only, not a response that ends early, so curl does
          # the download: HTTP/1.1, five retries with a pause between them.
          # A retry resumes the partial download (`-C -`). The loop does the
          # retrying, not curl's --retry, which removes what the failed try
          # wrote and starts again from byte zero, `-C -` or not.
          if (Test-Path $installer) {
            Write-Host "gstreamer.exe is in the cache, no download"
          } else {
            for ($try = 0; ; $try++) {
              curl.exe -sSL --http1.1 -C - -o $installer "$base/gstreamer-1.0-msvc-x86_64-$env:GSTREAMER_VERSION.exe"
              if ($LASTEXITCODE -eq 0) { break }
              if ($try -ge 5) { throw "the GStreamer installer did not download (curl exit $LASTEXITCODE)" }
              Start-Sleep -Seconds 15
            }
          }
          $root = "C:\gstreamer\1.0\msvc_x86_64"
          Start-Process -FilePath $installer -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/TYPE=full", "/DIR=$root" -Wait
          if (-not (Test-Path "$root\lib\pkgconfig\gstreamer-1.0.pc")) {
            Get-ChildItem $root -Recurse -Depth 2 | Select-Object -First 50 FullName
            throw "the GStreamer installer did not put the development files under $root"
          }
          "PKG_CONFIG_PATH=$root\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RICK_GSTREAMER_DIR=$root" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$root\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      # The version is the tag's; its release part must be the workspace's,
      # so `rick --version` and the archive name agree. During a cycle the
      # workspace carries a `-dev` suffix, which a dry run may keep.
      - name: version
        shell: bash
        run: |
          tag_version="${TAG#v}"
          crate_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          if [ "${tag_version%%-*}" != "${crate_version%%-*}" ]; then
            echo "tag $TAG does not match workspace version $crate_version"
            exit 1
          fi
          echo "VERSION=$tag_version" >> "$GITHUB_ENV"
          echo "NAME=rick-$tag_version-${{ matrix.platform }}" >> "$GITHUB_ENV"
      - name: pdfium
        shell: bash
        run: |
          dest="$RUNNER_TEMP/pdfium"
          if [ "${{ runner.os }}" = "Windows" ]; then
            dest="$(cygpath -u "$RUNNER_TEMP")/pdfium"
          fi
          mkdir -p "$dest"
          curl -sSL "https://github.com/bblanchon/pdfium-binaries/releases/latest/download/${{ matrix.pdfium }}.tgz" | tar xz -C "$dest"
          # The library's path goes into the PDF previewer's setting file in
          # the runner's config directory, which `cargo xtask bundle` reads
          # to copy the library beside the binary (issue 50: no environment
          # variable names it any more).
          if [ "${{ runner.os }}" = "Windows" ]; then
            lib="$dest/bin/pdfium.dll"; config="$(cygpath -u "$APPDATA")/Rick"; lib_setting="$(cygpath -m "$lib")"
          elif [ "${{ runner.os }}" = "macOS" ]; then
            lib="$dest/lib/libpdfium.dylib"; config="$HOME/Library/Application Support/Rick"; lib_setting="$lib"
          else
            lib="$dest/lib/libpdfium.so"; config="${XDG_CONFIG_HOME:-$HOME/.config}/rick"; lib_setting="$lib"
          fi
          echo "PDFIUM_LIB=$lib" >> "$GITHUB_ENV"
          mkdir -p "$config"
          printf 'library = "%s"\n' "$lib_setting" > "$config/preview-pdf.toml"
      # The 7-Zip library for the disk images (issue 51): 7z.so built from
      # the pinned sources on Linux and macOS, 7z.dll from the pinned
      # installer on Windows, with the licence text beside it.
      - name: 7-zip library
        shell: bash
        env: { SEVENZIP_SOURCE: build }
        run: |
          dest="$RUNNER_TEMP/sevenzip"
          if [ "${{ runner.os }}" = "Windows" ]; then dest="$(cygpath -u "$RUNNER_TEMP")/sevenzip"; fi
          .github/scripts/sevenzip.sh "$dest"
          if [ "${{ runner.os }}" = "Windows" ]; then
            echo "RICK_SEVENZIP_DIR=$(cygpath -w "$dest")" >> "$GITHUB_ENV"
          else
            echo "RICK_SEVENZIP_DIR=$dest" >> "$GITHUB_ENV"
          fi
      # The Visual C++ runtime: rick.exe, the kernel libraries, every plugin
      # and the GStreamer runtime import vcruntime140.dll, some of them
      # vcruntime140_1.dll and msvcp140.dll too, and the 0.3.0 archive, which
      # carried none, did not start on a machine without the Visual C++
      # Redistributable. The redistributable folder of the newest toolset of
      # the runner's Visual Studio, the one the build links with, is named
      # to the bundler, which copies its libraries beside the binary.
      - name: visual c++ runtime (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $install = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $install) { throw "no Visual Studio with the C++ tools on this runner" }
          $redist = Join-Path $install "VC\Redist\MSVC"
          $crt = Get-ChildItem -Path $redist -Directory |
            Where-Object { $_.Name -match '^\d+(\.\d+)+$' } |
            Sort-Object { [version]$_.Name } -Descending |
            ForEach-Object { Get-ChildItem -Path (Join-Path $_.FullName "x64") -Directory -Filter "Microsoft.VC*.CRT" -ErrorAction SilentlyContinue } |
            Where-Object { Test-Path (Join-Path $_.FullName "vcruntime140.dll") } |
            Select-Object -First 1
          if (-not $crt) {
            Get-ChildItem -Path $redist -Recurse -Depth 2 | Select-Object -First 60 FullName
            throw "no Microsoft.VC*.CRT folder with vcruntime140.dll under $redist"
          }
          Get-ChildItem -Path $crt.FullName | Select-Object Name, Length
          "RICK_VCRUNTIME_DIR=$($crt.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
      # The bundle: binary, kernel dylibs, libstd, pdfium (from the PDF
      # previewer's setting), the Visual C++ runtime (from RICK_VCRUNTIME_DIR on
      # Windows), plugins/ with the GStreamer runtime in the media plugin's
      # folder (from RICK_GSTREAMER_DIR on macOS and Windows) and the 7-Zip
      # library beside the archive plugin (from RICK_SEVENZIP_DIR), from one
      # build of every library, binary and example in the workspace with the
      # media previewer's playback on, the pdfium_check and preview_check
      # examples for the smoke test among them.
      - run: cargo xtask bundle --release --features ext-preview-media/gstreamer
      # The official macOS libraries are universal; the archive is for
      # Apple silicon, so the other half goes. Then the run paths are
      # printed, for the record of how the runtime is found from the
      # plugin's folder: the plugin's to gstreamer/lib beside itself, and
      # those every library and element of the runtime carries to the lib
      # folder it lies in or under.
      - name: thin the gstreamer libraries
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          media=target/release/bundle/plugins/preview-media
          find "$media/gstreamer" -type f -name '*.dylib' | while read -r file; do
            if lipo -info "$file" 2>/dev/null | grep -q "arm64"; then
              lipo -thin arm64 "$file" -output "$file.thin" 2>/dev/null && mv "$file.thin" "$file" || true
            fi
          done
          du -sh "$media/gstreamer"
          for file in "$media/libext_preview_media.dylib" \
                      "$media/gstreamer/lib/libgstreamer-1.0.0.dylib" \
                      "$media/gstreamer/lib/gstreamer-1.0/libgstcoreelements.dylib"; do
            echo "run paths of $file:"
            otool -l "$file" | grep -A2 LC_RPATH | grep ' path ' || echo "  none"
          done
          echo "what the plugin links of GStreamer:"
          otool -L "$media/libext_preview_media.dylib" | grep -i gst
      # A short video for the smoke test to play: the test pattern as
      # MPEG-4 part 2, written by the GStreamer the build has (the system's
      # on Linux, the official runtime on macOS and Windows). GStreamer
      # decodes that codec itself on every platform, through libav, whose
      # library lies in the media plugin's folder on macOS and Windows; so
      # the test is of the runtime, not of the machine. H.264 would be:
      # the macOS runners are virtual machines without a hardware video
      # decoder, and GStreamer's hardware decoder of macOS stops playback
      # there (vtdec_hw, "VTDecompressionSessionCreate returned -12906").
      - name: media sample
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p check
          gst-inspect-1.0 --exists avenc_mpeg4 || { echo "no MPEG-4 encoder (avenc_mpeg4) in this GStreamer"; exit 1; }
          gst-launch-1.0 -q videotestsrc num-buffers=90 pattern=smpte ! \
            video/x-raw,width=320,height=240,framerate=30/1 ! videoconvert ! \
            avenc_mpeg4 ! mp4mux ! filesink location=check/sample.mp4
          ls -l check/sample.mp4
      # The packages of the separate plugins and the manifest that lists
      # them (specs/plugin-distribution.md §4), from the bundle as it now
      # is: on macOS after the libraries were thinned, since the media
      # plugin's package holds them.
      - run: cargo xtask package --release
      - uses: actions/download-artifact@v4
        with: { name: third-party-licenses }
      - name: package
        shell: bash
        run: |
          set -euo pipefail
          exe=""
          if [ "${{ runner.os }}" = "Windows" ]; then exe=".exe"; fi
          mkdir -p "dist/$NAME"
          # macOS: Rick.app (specs/app-icons.md). Contents/MacOS holds the
          # whole bundle — the binary, the kernel dylibs and libstd, pdfium,
          # the GStreamer runtime and plugins/, as the binary's run path and
          # the plugin lookup expect them beside it; Info.plist comes from
          # the template with the release's version (the tag's release
          # part as the short version, the whole tag as the build version);
          # the icon set is the committed .icns. The texts sit beside the
          # bundle in the archive's folder.
          if [ "${{ runner.os }}" = "macOS" ]; then
            app="dist/$NAME/Rick.app/Contents"
            mkdir -p "$app/MacOS" "$app/Resources"
            cp -R target/release/bundle/. "$app/MacOS/"
            cp assets/icons/macos/Rick.icns "$app/Resources/Rick.icns"
            sed -e "s/@SHORT_VERSION@/${VERSION%%-*}/g" -e "s/@VERSION@/$VERSION/g" packaging/macos/Info.plist > "$app/Info.plist"
            plutil -lint "$app/Info.plist"
            bin="$app/MacOS"
            # licenses/, the texts pdfium and the standard library bring,
            # sits with the other texts beside the bundle.
            mv "$app/MacOS/licenses" "dist/$NAME/licenses"
          else
            cp -R target/release/bundle/. "dist/$NAME/"
            bin="dist/$NAME"
          fi
          # The archive carries the default set: the separate plugins, the
          # ones this platform's manifest lists a package for, leave the
          # tree (specs/plugin-distribution.md §4). The ZFS plugin's helper
          # rick-zfs stays beside the binary on Linux, where the plugin
          # looks for it once its package is installed.
          packages=target/release/packages
          manifest="$packages/plugins-${{ matrix.platform }}.json"
          separate="$(python3 -c 'import json,sys; print(" ".join(p["id"] for p in json.load(open(sys.argv[1], encoding="utf-8"))["plugins"]))' "$manifest")"
          echo "separate plugins: $separate"
          for id in $separate; do
            test -d "$bin/plugins/$id" || { echo "no plugins/$id in the bundle to take out"; exit 1; }
            rm -r "$bin/plugins/$id"
          done
          ls "$bin/plugins"
          cp "$packages"/*.rkp "$manifest" dist/
          cp LICENSE README.md CHANGELOG.md THIRD-PARTY-LICENSES.md "dist/$NAME/"
          # The component list the About dialog reads at start: beside the
          # binary, on macOS in the bundle's Resources
          # (specs/about-dialog.md, Generation).
          if [ "${{ runner.os }}" = "macOS" ]; then
            cp third-party.json "$app/Resources/third-party.json"
          else
            cp third-party.json "$bin/third-party.json"
          fi
          # Linux: the desktop entry and the icons in the XDG layout under
          # share/ (specs/app-icons.md), so that one copy of share/ into
          # ~/.local/share installs them and the installer plugin finds them
          # where it looks.
          if [ "${{ runner.os }}" = "Linux" ]; then
            mkdir -p "dist/$NAME/share/applications" "dist/$NAME/share/icons"
            cp packaging/linux/rick.desktop "dist/$NAME/share/applications/"
            cp -R assets/icons/linux/hicolor "dist/$NAME/share/icons/"
            # The polkit action of the ZFS plugin's helper rick-zfs, for a
            # system-wide install (#156).
            mkdir -p "dist/$NAME/share/polkit-1/actions"
            cp packaging/linux/org.openbreach.rick.zfs.policy "dist/$NAME/share/polkit-1/actions/"
          fi
          # The 7-Zip licence among the licences at the root as well as
          # beside the library.
          cp "$bin/plugins/vfs-archive/7-Zip-License.txt" "dist/$NAME/7-Zip-License.txt"
          ls -lR "dist/$NAME"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip "$NAME.zip" "$NAME" > /dev/null
            archive="$NAME.zip"
          elif [ "${{ runner.os }}" = "macOS" ]; then
            # ditto keeps the bundle's permissions and attributes, as
            # Finder's own Compress does.
            ditto -c -k --keepParent "$NAME" "$NAME.zip"
            archive="$NAME.zip"
          else
            tar czf "$NAME.tar.gz" "$NAME"
            archive="$NAME.tar.gz"
          fi
          # One checksum file each, for the archive, the packages and the
          # manifest; the release job gathers them into SHA256SUMS.txt.
          for file in "$archive" ./*.rkp ./plugins-*.json; do
            file="${file#./}"
            if command -v sha256sum > /dev/null; then
              sha256sum "$file" > "$file.sha256"
            else
              shasum -a 256 "$file" > "$file.sha256"
            fi
            cat "$file.sha256"
          done
          rm -r "$NAME"
          mkdir -p ../check
          cp "../target/release/examples/pdfium_check$exe" "../target/release/examples/preview_check$exe" ../check/
      # A build attestation for the release files this job made: the
      # archive, the plugin packages and their list
      # (specs/system-integration.md §9). The Linux files are attested by
      # Trebuchet's workflow, which builds them.
      - uses: actions/attest@v4
        with:
          subject-path: |
            dist/*.zip
            dist/*.rkp
            dist/plugins-*.json
      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error
      # The two test binaries and the sample video.
      - uses: actions/upload-artifact@v4
        with:
          name: pdfium-check-${{ matrix.platform }}
          path: check/
          if-no-files-found: error

  # Each archive, as a user gets it: unpacked in an empty directory, the
  # binary reports its version, lists the default set of the platform as
  # loaded and holds no separate plugin, and pdfium loads from beside it.
  # Then the packages of the platform: each is the file its manifest says,
  # and unpacked into the empty per-user plugins folder, as Install from
  # file… does it, every one of them loads from there. The media plugin
  # plays a video: from the archive on Linux, from its package on macOS
  # and Windows.
  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: Trebuchet's workflow tests every package and archive
          # where it is installed, with .github/scripts/linux-smoke.sh.
          - { os: "${{ vars.RUNNER_MACOS || 'macos-latest' }}", platform: macos-arm64 }
          - { os: "${{ vars.RUNNER_WINDOWS || 'windows-latest' }}", platform: windows-x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      # For .github/scripts/check-plugins.sh, the per-platform plugin check.
      - uses: actions/checkout@v4
      # The Linux archives use the system GStreamer: the media plugin links
      # it and loads only where it is installed, as a user's desktop has it,
      # with the plug-in packages that decode the sample video.
      - name: gstreamer and desktop-file-utils (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgstreamer1.0-0 libgstreamer-plugins-base1.0-0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav desktop-file-utils
      - uses: actions/download-artifact@v4
        with: { name: "archive-${{ matrix.platform }}", path: dist }
      - uses: actions/download-artifact@v4
        with: { name: "pdfium-check-${{ matrix.platform }}", path: check }
      - name: smoke test
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG#v}"
          name="rick-$version-${{ matrix.platform }}"
          exe=""
          if [ "${{ runner.os }}" = "Windows" ]; then exe=".exe"; fi
          cd dist
          dist="$PWD"
          for sums in ./*.sha256; do
            if command -v sha256sum > /dev/null; then sha256sum -c "$sums"; else shasum -a 256 -c "$sums"; fi
          done
          # The manifest of this platform's packages (Open-Breach/trebuchet,
          # docs/spec.md 7.4): nine of them, each a file that is here with
          # the size and the SHA-256 the manifest gives, built for this
          # release of Rick.
          python3 "$GITHUB_WORKSPACE/.github/scripts/check-packages.py" "plugins-${{ matrix.platform }}.json" "${{ matrix.platform }}"
          mkdir empty && cd empty
          case "${{ runner.os }}" in
            Windows) 7z x "../$name.zip" > /dev/null ;;
            macOS) ditto -x -k "../$name.zip" . ;;
            *) tar xzf "../$name.tar.gz" ;;
          esac
          cd "$name"
          ls -l
          for file in LICENSE README.md CHANGELOG.md THIRD-PARTY-LICENSES.md 7-Zip-License.txt; do
            test -f "$file" || { echo "missing $file"; exit 1; }
          done
          # The licence texts of what ships outside Cargo: the components
          # of about/bundled.toml in the file, and in licenses/ the texts
          # the pdfium build and the toolchain brought, pdfium's own with
          # those of the libraries built into it.
          grep -q '^## Bundled components$' THIRD-PARTY-LICENSES.md || { echo "THIRD-PARTY-LICENSES.md has no bundled components"; exit 1; }
          grep -q '^### pdfium ' THIRD-PARTY-LICENSES.md || { echo "THIRD-PARTY-LICENSES.md does not name pdfium"; exit 1; }
          for file in licenses/pdfium/LICENSE licenses/rust/COPYRIGHT-library.html; do
            test -s "$file" || { echo "missing $file"; exit 1; }
          done
          test "$(ls licenses/pdfium | wc -l)" -gt 5 || { echo "licenses/pdfium holds no texts of the libraries built into pdfium"; ls licenses/pdfium; exit 1; }
          # macOS: the bundle (specs/app-icons.md) — a valid Info.plist
          # naming the binary and the icon, the icon set, and the binary
          # with everything beside it in Contents/MacOS, where the checks
          # below look.
          if [ "${{ runner.os }}" = "macOS" ]; then
            plist=Rick.app/Contents/Info.plist
            plutil -lint "$plist"
            for key in CFBundleIdentifier CFBundleExecutable CFBundleIconFile CFBundleShortVersionString CFBundleVersion; do
              echo "$key = $(/usr/libexec/PlistBuddy -c "Print :$key" "$plist")"
            done
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")" = "org.open-breach.rick" || { echo "wrong bundle identifier"; exit 1; }
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$plist")" = "rick" || { echo "wrong bundle executable"; exit 1; }
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$plist")" = "Rick" || { echo "wrong bundle icon"; exit 1; }
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")" = "$version" || { echo "wrong bundle version"; exit 1; }
            test -f Rick.app/Contents/Resources/Rick.icns || { echo "no Rick.icns in the bundle"; exit 1; }
            cmp Rick.app/Contents/Resources/Rick.icns "$GITHUB_WORKSPACE/assets/icons/macos/Rick.icns" || { echo "Rick.icns is not the committed one"; exit 1; }
            test -d Rick.app/Contents/MacOS/plugins || { echo "no plugins/ beside the binary in the bundle"; exit 1; }
            test -f Rick.app/Contents/Resources/third-party.json || { echo "no third-party.json in the bundle's Resources"; exit 1; }
            cd Rick.app/Contents/MacOS
            ls -l
          else
            test -f third-party.json || { echo "no third-party.json beside the binary"; exit 1; }
          fi
          test -f "rick$exe" || { echo "missing rick$exe"; exit 1; }
          # The About dialog's component list parses and names crates. Read as
          # UTF-8: the licence texts are not in Windows' default code page.
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1], encoding="utf-8")); assert isinstance(d,list) and len(d) > 100, "too few entries"; print(len(d), "third-party entries")' \
            "$([ "${{ runner.os }}" = "macOS" ] && echo ../Resources/third-party.json || echo third-party.json)"
          test -f libpdfium.so || test -f libpdfium.dylib || test -f pdfium.dll || { echo "no pdfium library beside the binary"; exit 1; }
          # The macOS and Windows archives hold no GStreamer: the runtime
          # travels in the media plugin's package
          # (specs/plugin-distribution.md §4).
          if [ "${{ runner.os }}" != "Linux" ]; then
            found="$(find . -iname '*gst*' -o -iname '*gstreamer*' | head -5)"
            test -z "$found" || { echo "GStreamer in the archive:"; echo "$found"; exit 1; }
          fi
          # Linux: the desktop entry and the icons under share/
          # (specs/app-icons.md): the entry valid and naming the app id
          # `rick` as its icon and its StartupWMClass, and every file of
          # the repository's hicolor set at its place.
          if [ "${{ runner.os }}" = "Linux" ]; then
            desktop-file-validate share/applications/rick.desktop
            grep -qx 'Icon=rick' share/applications/rick.desktop || { echo "the desktop entry's Icon is not rick"; exit 1; }
            grep -qx 'StartupWMClass=rick' share/applications/rick.desktop || { echo "the desktop entry's StartupWMClass is not rick"; exit 1; }
            diff <(cd "$GITHUB_WORKSPACE/assets/icons/linux/hicolor" && find . -type f | sort) <(cd share/icons/hicolor && find . -type f | sort) \
              || { echo "the icons under share/ are not the repository's hicolor set"; exit 1; }
            test -f share/icons/hicolor/scalable/apps/rick.svg || { echo "no scalable icon"; exit 1; }
            find share -type f | sort
          fi
          # The kernel dylibs and libstd the binary shares with the plugins.
          ls -1 | grep -Eq '^(lib)?std-' || { echo "no libstd beside the binary"; exit 1; }
          ls -1 | grep -Eq '^(lib)?ext\.' || { echo "no ext library beside the binary"; exit 1; }
          # The version text, the About dialog's details
          # (specs/about-dialog.md): the first line the name and the
          # workspace version (the tag without any pre-release suffix, a
          # `-dev` workspace keeps its suffix), the second the build line
          # with the short commit, this OS and architecture, the plugin ABI
          # and the build date; then the toolchain, the OS, and one line
          # per plugin.
          out="$("./rick$exe" --version)"
          echo "rick --version:"; echo "$out"
          printf '%s\n' "$out" | sed -n 1p | grep -Eq "^Rick ${version%%-*}(-[0-9A-Za-z.]+)?$" || { echo "unexpected version line"; exit 1; }
          printf '%s\n' "$out" | sed -n 2p | grep -Eq "^[0-9a-f]{7,} · (Linux|macOS|Windows) [a-z0-9_]+ · plugin ABI [0-9]+ · built [0-9]{4}-[0-9]{2}-[0-9]{2}$" || { echo "unexpected build line"; exit 1; }
          printf '%s\n' "$out" | sed -n 3p | grep -q "^rustc " || { echo "no toolchain line"; exit 1; }
          printf '%s\n' "$out" | grep -Eq "^vfs-trash [0-9][^ ]* loaded$" || { echo "the trash plugin is not listed as loaded"; exit 1; }
          # The default set, in plugins/<id>/ and loaded: the trash and
          # archive providers, the archive, markup, hex and icon previewers,
          # the subdirectory search and this platform's index connectors,
          # the actions and the installer, on Linux the media previewer
          # with the runner's system GStreamer; no separate plugin and
          # nothing else in plugins/; and the 7-Zip library with its
          # licence beside the archive plugin (issue 51).
          "$GITHUB_WORKSPACE/.github/scripts/check-plugins.sh" . --sevenzip --archive
          # pdfium from beside the binary: the previewer's test binary, copied
          # next to rick, with no setting (a fresh runner) and no system
          # pdfium. The example has no run path of its own, so the library
          # path names the directory for the kernel dylibs and libstd.
          if [ "${{ runner.os }}" = "macOS" ]; then
            cp "../../../../../../check/pdfium_check$exe" .
          else
            cp "../../../check/pdfium_check$exe" .
          fi
          chmod +x "pdfium_check$exe"
          LD_LIBRARY_PATH=. DYLD_LIBRARY_PATH=. "./pdfium_check$exe" | tee check.txt
          grep -q "^pdfium ok" check.txt
          # Windows: the icon and version resource of rick.exe
          # (specs/app-icons.md), as Explorer's Properties dialog reads it.
          if [ "${{ runner.os }}" = "Windows" ]; then
            pwsh -NoProfile -File "$GITHUB_WORKSPACE/.github/scripts/check-exe-resource.ps1" rick.exe "$version"
            # The Visual C++ runtime beside rick.exe: every library of it
            # that a module of the archive imports is in the archive. The
            # import tables are read from the files, since this runner has
            # Visual Studio and rick.exe starting here proves nothing.
            python3 "$GITHUB_WORKSPACE/.github/scripts/check-vcruntime.py" .
          fi
          # The packages, installed the way Install from file… does it:
          # each is unpacked into the per-user plugins folder, which is
          # empty on this runner, its folder whole. Every separate plugin
          # of the platform then loads, which it can only do from there.
          case "${{ runner.os }}" in
            macOS) user_plugins="$HOME/Library/Application Support/Rick/plugins" ;;
            Windows) user_plugins="$(cygpath -u "$APPDATA")/Rick/plugins" ;;
            *) user_plugins="${XDG_CONFIG_HOME:-$HOME/.config}/rick/plugins" ;;
          esac
          if [ -d "$user_plugins" ] && [ -n "$(ls -A "$user_plugins")" ]; then
            echo "$user_plugins is not empty on this runner"; ls "$user_plugins"; exit 1
          fi
          if [ "${{ runner.os }}" != "Linux" ]; then
            if command -v gst-inspect-1.0 > /dev/null || [ -e /Library/Frameworks/GStreamer.framework ]; then
              echo "this runner has a GStreamer of its own; the media test would prove nothing"; exit 1
            fi
          fi
          mkdir -p "$user_plugins"
          for package in "$dist"/*-"${{ matrix.platform }}".rkp; do
            echo "installing $(basename "$package")"
            python3 -m zipfile -e "$package" "$user_plugins"
          done
          ls "$user_plugins"
          "$GITHUB_WORKSPACE/.github/scripts/check-plugins.sh" . --archive --installed
          # The media preview, played for real: the host's test binary
          # loads the plugins as rick does and plays the sample video
          # through the previewer that claims it. On Linux the plugin is
          # the archive's, with the system GStreamer. On macOS and Windows
          # it is the one just installed from its package, and the runtime
          # in its folder has to be found from there, on a runner that has
          # no GStreamer of its own.
          cp "$GITHUB_WORKSPACE/check/preview_check$exe" .
          chmod +x "preview_check$exe"
          from="per-user"
          if [ "${{ runner.os }}" = "Linux" ]; then from="beside the binary"; fi
          sample="$GITHUB_WORKSPACE/check/sample.mp4"
          if ! LD_LIBRARY_PATH=. DYLD_LIBRARY_PATH=. "./preview_check$exe" "$sample" --play | tee media.txt; then
            # GStreamer's own account of what refused, for whoever reads
            # this log: its warnings and errors, which name the element.
            echo "the sample did not play; once more with GStreamer's warnings:"
            GST_DEBUG=2 LD_LIBRARY_PATH=. DYLD_LIBRARY_PATH=. "./preview_check$exe" "$sample" --play 2>&1 \
              | grep -v "^plugin .*: loaded, " | tail -40 || true
            exit 1
          fi
          grep -q "^plugin preview-media: loaded, $from, " media.txt || { echo "the media plugin was not loaded from $from"; exit 1; }
          grep -q "^preview ok: .*first frame 320x240, played to " media.txt || { echo "the sample video did not play"; exit 1; }

  release:
    needs: [build, smoke, linux]
    runs-on: ${{ vars.RUNNER_LINUX_X64 || 'ubuntu-24.04' }}
    timeout-minutes: 15
    # contents: write for the release; the other two to attest the
    # checksums, the one release file this job makes.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: "archive-*", path: dist, merge-multiple: true }
      # The Linux files, one artifact per target and architecture: the deb
      # or rpm of each, and from one target per architecture the archive
      # with its plugin packages and their list.
      - uses: actions/download-artifact@v4
        with: { pattern: "linux_rick_*", path: dist, merge-multiple: true }
      - name: checksums and body
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          ls -l
          for arch in x64 arm64; do
            test -f "rick-${TAG#v}-linux-$arch.tar.gz" || { echo "no Linux archive for $arch"; exit 1; }
            test -f "plugins-linux-$arch.json" || { echo "no plugin list for linux-$arch"; exit 1; }
            # The manifest of the Linux packages, as the smoke test checks
            # it for the other platforms: nine of them, each a file that is
            # here with the size and the SHA-256 the manifest gives.
            python3 ../.github/scripts/check-packages.py "plugins-linux-$arch.json" "linux-$arch"
          done
          # The build job wrote a checksum file beside each of its files;
          # the Linux files come without, and get theirs here.
          for file in *; do
            case "$file" in *.sha256) continue ;; esac
            test -f "$file.sha256" || sha256sum "$file" > "$file.sha256"
          done
          cat ./*.sha256 | sort -k2 > SHA256SUMS.txt
          rm ./*.sha256
          cat SHA256SUMS.txt
          cd ..
          python3 .github/scripts/changelog-section.py "$TAG" CHANGELOG.md > body.md
          {
            echo
            echo "Archives: the \`rick\` binary with the shared kernel libraries, libstd and the pdfium library beside it, and \`plugins/\` with the plugins every install has: the trash and the archives, the previewers for archives, markup (Markdown, HTML, CSV), icons and the hex view, the subdirectory search and the platform's search-index connector (Windows Search, Spotlight, or Tracker and Baloo), bulk rename, compress and extract, compare, the console and the installer, and on Linux the audio and video previewer (it uses the system's GStreamer: install the gstreamer1.0 plug-in packages for playback). Also the 7-Zip library (LGPL) beside the archive plugin for the disk images, on Linux the desktop entry and the icons under \`share/\` in the XDG layout (copy \`share/\` into \`~/.local/share/\` and put \`rick\` on the PATH, or install the tarball with Rick's installer plugin), on macOS all of it inside \`Rick.app\` (drag it to Applications), LICENSE, README, CHANGELOG, THIRD-PARTY-LICENSES, the 7-Zip licence and \`third-party.json\` beside the binary (the component list the About dialog shows)."
            echo
            echo "Plugins that are separate downloads: Git, SVN, ZFS (Linux), SSH, S3, Azure Blob, Google Cloud Storage, Office documents, 3D models and, on macOS and Windows, audio and video with its GStreamer runtime. Each is one \`<id>-<version>-<platform>.rkp\` below. Download the ones for your platform and install them with *Install from file…* in the Extensions dialogue; they are loaded at the next start. A package fits the Rick of this release only. \`plugins-<platform>.json\` lists a platform's packages for the plugin registry."
            echo
            echo "Linux packages: a \`.deb\` for each supported Debian and Ubuntu release and an \`.rpm\` for each supported Fedora release, for x86-64 and arm64, with the same plugins as the archives. The separate plugins are packages of their own there, \`rick-plugin-<id>\`, and \`rick-plugins\` is all of them; each fits the \`rick\` package of this release only, and the package manager keeps them together. They are also in the apt and dnf repositories on get.openbreach.dev. A package brings what a video in H.264 needs to play. On Fedora the H.264 library itself comes from Cisco's OpenH264 repository, which Fedora enables by default; with that repository switched off Rick still installs, and says the decoder is missing when it is asked to play such a video."
            echo
            echo "\`SHA256SUMS.txt\` has the checksums of the archives, the packages and the lists. Not signed or notarised (see docs/building.md)."
            echo
            echo "Every file has a GitHub build attestation, which says which workflow built it and from which commit. To check a Linux file, with the GitHub CLI: \`gh attestation verify <file> --owner Open-Breach --signer-repo Open-Breach/trebuchet\`. A macOS or Windows file, or \`SHA256SUMS.txt\`: \`gh attestation verify <file> --repo Open-Breach/rick\`. An attestation proves where a file comes from, not that it is safe."
          } >> body.md
          cat body.md
      - uses: actions/attest@v4
        with:
          subject-path: dist/SHA256SUMS.txt
      # The release of the tag. Trebuchet's job has attached the Linux files
      # already and, where the tag had no release yet, made a draft for
      # them. This step works on that same release: it adds the files of
      # the other platforms and the checksums, and gives the release its
      # name and its notes. It does not publish: the release stays the
      # draft it is until the `verify` job has passed, and the `publish`
      # job makes it public. Whether it is a draft is not touched here, so
      # a run repeated for a release that is out already leaves it out.
      # The Linux files are uploaded once more, the same bytes, so that the
      # release holds what SHA256SUMS.txt names even where Trebuchet's job
      # attached nothing.
      - name: draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ contains(env.TAG, '-') }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --draft --title "Rick $TAG" --notes-file body.md --target "$GITHUB_SHA"
          fi
          gh release upload "$TAG" --clobber \
            dist/*.tar.gz dist/*.zip dist/*.deb dist/*.rpm dist/*.rkp dist/plugins-*.json dist/SHA256SUMS.txt
          gh release edit "$TAG" --title "Rick $TAG" --notes-file body.md --target "$GITHUB_SHA" \
            --prerelease="$PRERELEASE"
          gh release view "$TAG" --json name,isDraft,isPrerelease,assets \
            --jq '"\(.name): draft \(.isDraft), pre-release \(.isPrerelease), \(.assets | length) files"'

  # The draft, checked the way a release's users are told to check it
  # (specs/system-integration.md §9), before anyone can download it. One
  # Linux package and the two archives of this workflow's own, macOS and
  # Windows, are downloaded from the draft and verified with the two
  # documented lines: the package against Trebuchet's workflow, which built
  # it, the archives against this repository's. A copy of the package with
  # one byte changed must not verify. Publishing waits for this job: where
  # it fails, the release stays a draft, nothing is public, and the job's
  # summary says so.
  verify:
    needs: release
    runs-on: ${{ vars.RUNNER_LINUX_X64 || 'ubuntu-24.04' }}
    timeout-minutes: 10
    # A draft is visible with write access only.
    permissions:
      contents: write
      attestations: read
    steps:
      - name: attestations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          mkdir files
          cd files
          gh release download "$TAG" --pattern 'rick_*_amd64.deb' \
            --pattern "rick-$version-macos-arm64.zip" --pattern "rick-$version-windows-x64.zip"
          deb="$(find . -name 'rick_*_amd64.deb' | sort | sed -n 1p)"
          test -n "$deb" || { echo "no deb on the release"; exit 1; }
          echo "::group::$deb, built by Trebuchet's workflow"
          gh attestation verify "$deb" --owner "$GITHUB_REPOSITORY_OWNER" --signer-repo Open-Breach/trebuchet
          echo "verified: $deb"
          echo "::endgroup::"
          for archive in "rick-$version-macos-arm64.zip" "rick-$version-windows-x64.zip"; do
            echo "::group::$archive, built by this workflow"
            gh attestation verify "$archive" --repo "$GITHUB_REPOSITORY"
            echo "verified: $archive"
            echo "::endgroup::"
          done
          # One byte of the package changed, in the middle of the file.
          python3 -c 'import sys; d = bytearray(open(sys.argv[1], "rb").read()); d[len(d) // 2] ^= 1; open(sys.argv[2], "wb").write(d)' "$deb" changed.deb
          echo "::group::the same package with one byte changed"
          if gh attestation verify changed.deb --owner "$GITHUB_REPOSITORY_OWNER" --signer-repo Open-Breach/trebuchet; then
            echo "::endgroup::"
            echo "a package changed by one byte verified"
            exit 1
          fi
          echo "::endgroup::"
          echo "the package and both archives verify, and the changed package does not"
          {
            echo "### Verified"
            echo
            echo "Of the draft of \`$TAG\`: \`${deb#./}\` and both archives verify, and a copy of the package with one byte changed does not."
          } >> "$GITHUB_STEP_SUMMARY"
      # What a failed check leaves, said where the run is looked at first.
      # The release is asked, not assumed: a run repeated for a release
      # that was out before stays out.
      - name: not published
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          case "$(gh release view "$TAG" --json isDraft --jq .isDraft 2> /dev/null || echo none)" in
            true) left="The release stays a draft: nothing is public, and the package repositories are not told." ;;
            false) left="The release of this tag was public before this run, and still is. The package repositories are not told." ;;
            *) left="No release of this tag was found: nothing is public." ;;
          esac
          {
            echo "### Not published"
            echo
            echo "The check of the attestations of \`$TAG\` did not pass. $left The log of this job says what failed."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$left"

  # Publishing, the last step of a release, and only after the files of the
  # draft have verified. A plain tag's draft becomes the published release
  # here. A tag with a pre-release suffix and a dry run stay drafts: the job
  # runs for them all the same and says what it left, so that a dry run
  # goes through the whole order.
  publish:
    needs: verify
    runs-on: ${{ vars.RUNNER_LINUX_X64 || 'ubuntu-24.04' }}
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PUBLISH: ${{ github.event_name == 'push' && !contains(env.TAG, '-') }}
        run: |
          set -euo pipefail
          if [ "$PUBLISH" = true ]; then
            gh release edit "$TAG" --draft=false
            said="Published, after its files verified."
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            said="A dry run: its files verified, and it stays a draft. A plain tag is published at this step."
          else
            said="A pre-release: its files verified, and it stays a draft."
          fi
          state="$(gh release view "$TAG" --json name,isDraft,isPrerelease,assets \
            --jq '"\(.name): draft \(.isDraft), pre-release \(.isPrerelease), \(.assets | length) files"')"
          echo "$said"
          echo "$state"
          { echo "### $TAG"; echo; echo "$said"; echo; echo "$state"; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$PUBLISH" = true ] && [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != false ]; then
            echo "::error::$TAG is still a draft after publishing"
            exit 1
          fi

  # The apt and dnf repositories on get.openbreach.dev: Trebuchet's publisher
  # is told of the release and takes its deb and rpm files from the release
  # page (Open-Breach/trebuchet, docs/publisher.md). Only for a published
  # release, so after the `publish` job: a pre-release and a dry run are
  # drafts, which the publisher cannot fetch, and the repositories have one
  # channel. The token may send this one event to that one repository; the
  # first job of the run has looked for it already.
  repositories:
    needs: [licenses, publish]
    if: github.event_name == 'push' && !contains(github.ref_name, '-')
    runs-on: ${{ vars.RUNNER_LINUX_X64 || 'ubuntu-24.04' }}
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: tell the publisher
        env:
          GH_TOKEN: ${{ secrets.TREBUCHET_DISPATCH_TOKEN }}
          VERSION: ${{ needs.licenses.outputs.version }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::the secret TREBUCHET_DISPATCH_TOKEN is not set: the release is published, the repositories are not told"
            exit 1
          fi
          gh api repos/Open-Breach/trebuchet/dispatches \
            -f event_type=release \
            -f "client_payload[app]=rick" \
            -f "client_payload[version]=$VERSION" \
            -f "client_payload[release_url]=https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
