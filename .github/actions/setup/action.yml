name: setup
description: >-
  The Rust toolchain of rust-toolchain.toml with the requested components,
  the cargo cache, the Linux system packages the previewers need, the
  software graphics adapter the 3D previewer's tests render on, and pdfium
  for the PDF previewer. Shared by the ci, full and bench workflows (issue
  35); release.yml has its own steps.
inputs:
  components:
    description: Toolchain components to add, comma-separated (rustfmt, clippy).
    required: false
    default: ""
  system:
    description: >-
      The system packages (issue 18). "build" installs the GStreamer
      development files the media previewer's gstreamer feature compiles
      against. "test" adds the GStreamer codec plug-ins, LibreOffice and
      lavapipe, Mesa's software Vulkan driver, and sets
      RICK_REQUIRE_GSTREAMER, RICK_REQUIRE_LIBREOFFICE and RICK_REQUIRE_WGPU,
      so their tests fail rather than skip when any is missing; and, for
      milestone 5 (issue 22), Subversion on every runner with
      RICK_REQUIRE_SVN set, Tracker and Baloo on Linux (their tests run
      through .github/scripts/with-indexers.sh), and the Windows Search
      service started on Windows, with RICK_SEARCH_FIXTURE naming a
      directory under the home the platform index covers and
      RICK_REQUIRE_SPOTLIGHT or RICK_REQUIRE_WINDOWS_SEARCH set. "none"
      installs nothing. The GStreamer and LibreOffice parts are Linux only;
      macOS and Windows skip those tests with a note. On Windows "test" also
      sets RICK_REQUIRE_WGPU, since the dx12 software adapter (WARP) is part
      of the system; the 3D previewer's tests skip with a note on a macOS
      runner without a graphics adapter (issue 19).
    required: false
    default: test
  pdfium:
    description: >-
      Bind pdfium for the PDF previewer (issue 50, no environment variable):
      the release binary for this runner is copied beside the test binaries
      (target/<profile>/deps/, where a previewer looks "beside the binary"
      when the tests run it with their temporary config directory) and its
      path is written into the PDF previewer's setting file in the runner's
      config directory (preview-pdf.toml, which the rick binary and `cargo
      xtask bundle` read), with RICK_REQUIRE_PDFIUM set so the tests fail
      rather than skip when the binding is missing.
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: ${{ inputs.components }}
    # The cargo registry and the dependencies' build artifacts, keyed by the
    # job, the lock file and the toolchain; the workspace crates themselves
    # are rebuilt every run.
    - uses: Swatinem/rust-cache@v2
    - name: gstreamer development files
      if: runner.os == 'Linux' && inputs.system != 'none'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
    - name: gstreamer plug-ins, libreoffice and lavapipe
      if: runner.os == 'Linux' && inputs.system == 'test'
      shell: bash
      run: |
        sudo apt-get install -y --no-install-recommends \
          gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
          gstreamer1.0-plugins-ugly gstreamer1.0-libav \
          libreoffice-writer libreoffice-calc libreoffice-impress \
          mesa-vulkan-drivers
        echo "RICK_REQUIRE_GSTREAMER=1" >> "$GITHUB_ENV"
        echo "RICK_REQUIRE_LIBREOFFICE=1" >> "$GITHUB_ENV"
        echo "RICK_REQUIRE_WGPU=1" >> "$GITHUB_ENV"
    - name: subversion and the linux indexers
      if: runner.os == 'Linux' && inputs.system == 'test'
      shell: bash
      run: |
        sudo apt-get install -y --no-install-recommends subversion dbus tracker tracker-miner-fs
        sudo apt-get install -y --no-install-recommends baloo-kf6 || sudo apt-get install -y --no-install-recommends baloo-kf5
        echo "RICK_REQUIRE_SVN=1" >> "$GITHUB_ENV"
        # Issue 44: desktop-file-validate checks every desktop entry the
        # installer writes; its tests fail rather than skip without it here.
        sudo apt-get install -y --no-install-recommends desktop-file-utils
        echo "RICK_REQUIRE_DESKTOP_FILE_VALIDATE=1" >> "$GITHUB_ENV"
    - name: subversion and spotlight
      if: runner.os == 'macOS' && inputs.system == 'test'
      shell: bash
      run: |
        brew install subversion
        echo "RICK_REQUIRE_SVN=1" >> "$GITHUB_ENV"
        mkdir -p "$HOME/rick-search-fixture"
        echo "RICK_SEARCH_FIXTURE=$HOME/rick-search-fixture" >> "$GITHUB_ENV"
        echo "RICK_REQUIRE_SPOTLIGHT=1" >> "$GITHUB_ENV"
        mdutil -s / || true
    - name: subversion and windows search
      if: runner.os == 'Windows' && inputs.system == 'test'
      shell: pwsh
      run: |
        choco install -y --no-progress svn
        echo "RICK_REQUIRE_SVN=1" >> $env:GITHUB_ENV
        Set-Service WSearch -StartupType Automatic
        Start-Service WSearch
        Get-Service WSearch
        New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\rick-search-fixture" | Out-Null
        echo "RICK_SEARCH_FIXTURE=$env:USERPROFILE\rick-search-fixture" >> $env:GITHUB_ENV
        echo "RICK_REQUIRE_WINDOWS_SEARCH=1" >> $env:GITHUB_ENV
    # Issue 19: the 3D previewer renders on WARP, Windows' software adapter,
    # which wgpu's dx12 backend finds by itself; the tests must not skip.
    - name: software graphics adapter required
      if: runner.os == 'Windows' && inputs.system == 'test'
      shell: bash
      run: echo "RICK_REQUIRE_WGPU=1" >> "$GITHUB_ENV"
    - name: pdfium
      if: inputs.pdfium == 'true'
      shell: bash
      run: |
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64) asset=pdfium-linux-x64 ;;
          Linux-ARM64) asset=pdfium-linux-arm64 ;;
          macOS-ARM64) asset=pdfium-mac-arm64 ;;
          macOS-X64) asset=pdfium-mac-x64 ;;
          Windows-X64) asset=pdfium-win-x64 ;;
          *) echo "no pdfium build for $RUNNER_OS-$RUNNER_ARCH"; exit 1 ;;
        esac
        # Git Bash's tar reads a Windows path's drive colon as a host, so
        # work in POSIX form there and hand Rust the Windows form.
        dest="$RUNNER_TEMP/pdfium"
        if [ "$RUNNER_OS" = "Windows" ]; then
          dest="$(cygpath -u "$RUNNER_TEMP")/pdfium"
        fi
        mkdir -p "$dest"
        curl -sSL "https://github.com/bblanchon/pdfium-binaries/releases/latest/download/$asset.tgz" | tar xz -C "$dest"
        # The library file, and the config directory the setting goes into,
        # as platform::ConfigDir computes it (QUESTIONS.md 188).
        case "$RUNNER_OS" in
          Windows) lib="$dest/bin/pdfium.dll"; config="$(cygpath -u "$APPDATA")/Rick"; lib_setting="$(cygpath -m "$lib")" ;;
          macOS)   lib="$dest/lib/libpdfium.dylib"; config="$HOME/Library/Application Support/Rick"; lib_setting="$lib" ;;
          *)       lib="$dest/lib/libpdfium.so"; config="${XDG_CONFIG_HOME:-$HOME/.config}/rick"; lib_setting="$lib" ;;
        esac
        test -f "$lib" || { echo "no pdfium library in $dest"; exit 1; }
        # Beside every test binary: the tests run with a temporary config
        # directory and find the library the way a user without the setting
        # would, beside the binary.
        for profile in debug release; do
          mkdir -p "$GITHUB_WORKSPACE/target/$profile/deps"
          cp "$lib" "$GITHUB_WORKSPACE/target/$profile/deps/"
          cp "$lib" "$GITHUB_WORKSPACE/target/$profile/"
        done
        # The setting, for the rick binary and the bundle.
        mkdir -p "$config"
        printf 'library = "%s"\n' "$lib_setting" > "$config/preview-pdf.toml"
        cat "$config/preview-pdf.toml"
        echo "RICK_REQUIRE_PDFIUM=1" >> "$GITHUB_ENV"
