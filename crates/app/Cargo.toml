[package]
name = "app"
version.workspace = true
description = "Rick application state: the command loop that turns Commands into model changes and Events, the undo log, the extension registry and the TOML settings."
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
types = { workspace = true }
runtime = { workspace = true }
platform = { workspace = true }
ext = { workspace = true }
vfs = { workspace = true }
vfs-local = { workspace = true }
vfs-rick = { workspace = true }
model = { workspace = true }
ops = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "macros"] }
toml = { workspace = true }
encoding_rs = { workspace = true }
# The preview pane's Copy inflates a gzip-compressed file (an SVGZ) before
# decoding its text (issue 83).
flate2 = { workspace = true }
# A plugin package is a zip archive of the plugin's folder, unpacked into
# the per-user plugins folder (issue 139).
zip = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
