[package]
name = "ext-search-tracker"
version.workspace = true
description = "Rick's Tracker 3 search connector: the GNOME file index queried with SPARQL over D-Bus, feeding the title-row search box on Linux."
edition.workspace = true
license.workspace = true
repository.workspace = true

# A plugin: a `cdylib` the host loads from `plugins/search-tracker/`, and an
# `rlib` for the binary's opt-in `search-tracker` feature and the tests.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
types = { workspace = true }
ext = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true, features = ["time"] }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
