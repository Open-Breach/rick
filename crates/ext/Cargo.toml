[package]
name = "ext"
version.workspace = true
description = "Rick extension API: the five extension-point traits, their data types, manifests and the registry."
edition.workspace = true
license.workspace = true
repository.workspace = true

# A Rust dylib shared by the binary and the plugin libraries (QUESTIONS.md 81);
# the rlib is for the doctests, which cargo runs for no dylib-only crate.
[lib]
crate-type = ["dylib", "rlib"]

[dependencies]
thiserror = { workspace = true }
types = { workspace = true }
runtime = { workspace = true }
platform = { workspace = true }
async-trait = { workspace = true }
bitflags = { workspace = true }
futures = { workspace = true }
semver = { workspace = true }
smallvec = { workspace = true }
tokio = { workspace = true, features = ["io-util"] }
# The terminal emulator behind the console pane (`terminal`): the parser of
# the escape sequences a shell writes, shared by every plugin that attaches
# a stream to the pane (the local console, a shell over SSH).
vte = { workspace = true }
# The `t!` lookup (`i18n`): Fluent messages bundled by the kernel and the
# plugins, the system language negotiated against them, a tracing line for
# a key nobody translated.
fluent-bundle = { workspace = true }
unic-langid = { workspace = true }
sys-locale = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util"] }
tempfile = { workspace = true }

[lints]
workspace = true
