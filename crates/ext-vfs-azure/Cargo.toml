[package]
name = "ext-vfs-azure"
version.workspace = true
description = "Rick's Azure Blob provider: storage accounts as locations, containers as top-level folders and blob name prefixes as folders below them, with Copy Blob on the service for moves and copies inside an account."
edition.workspace = true
license.workspace = true
repository.workspace = true

# A plugin: a `cdylib` the host loads from `plugins/vfs-azure/`, and an
# `rlib` for the binary's opt-in `vfs-azure` feature and the tests.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
types = { workspace = true }
ext = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true, features = ["io-util", "sync", "time"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
bytes = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
percent-encoding = { workspace = true }
url = { workspace = true }
roxmltree = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
runtime = { workspace = true }
platform = { workspace = true }

[lints]
workspace = true
