[package]
name = "platform"
version.workspace = true
description = "Rick platform layer: trash, open-with, properties, config directory, native dialogs, the native drag source and drop position, and the per-OS filesystem fast paths."
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
types = { workspace = true }
runtime = { workspace = true }
arboard = { workspace = true }
async-trait = { workspace = true }
raw-window-handle = { workspace = true }
rayon = { workspace = true }
rfd = { workspace = true, features = ["xdg-portal", "tokio"] }
serde = { workspace = true }
# The request and reply of `rick-perms`, the privileged helper (`perms::helper`).
serde_json = { workspace = true }
# The SSH agent's socket (`agent`): a Unix socket on Linux and macOS, the
# OpenSSH agent's named pipe on Windows, opened on the one runtime.
tokio = { workspace = true, features = ["net", "time", "io-util"] }
tempfile = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
# The 7-Zip library behind the disk images (`sevenzip`), loaded at run
# time from the plugins directory or a known install.
libloading = { workspace = true }
tracing = { workspace = true }
# The platform keychain behind `Secrets`: one store per operating system,
# chosen by the crate itself (Secret Service over zbus on Linux, Keychain
# on macOS, the Credential Manager on Windows).
keyring = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true }
rustix = { workspace = true, features = ["fs", "pipe", "process", "std"] }
wayland-client = { workspace = true }
wayland-backend = { workspace = true }
x11rb = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
libc = { workspace = true }
objc2 = { workspace = true }
objc2-foundation = { workspace = true, features = ["NSArray", "NSFileManager", "NSURL", "NSError", "NSString", "NSGeometry", "NSDate"] }
objc2-app-kit = { workspace = true, features = [
    "NSApplication",
    "NSDragging",
    "NSDraggingItem",
    "NSDraggingSession",
    "NSEvent",
    "NSGraphicsContext",
    "NSImage",
    "NSPasteboard",
    "NSResponder",
    "NSView",
    "NSWindow",
    "NSWorkspace",
] }
rustix = { workspace = true, features = ["fs", "process", "std"] }

[target.'cfg(windows)'.dependencies]
windows-core = { workspace = true }
junction = { workspace = true }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_NetManagement",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
