[package]
name = "runtime"
version.workspace = true
description = "Rick job system: the single tokio runtime, the JobRunner and the rayon compute pool."
edition.workspace = true
license.workspace = true
repository.workspace = true

# A Rust dylib shared by the binary and the plugin libraries (QUESTIONS.md 81);
# the rlib is for the doctests, which cargo runs for no dylib-only crate.
[lib]
crate-type = ["dylib", "rlib"]

[dependencies]
types = { workspace = true }
rayon = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "macros", "time", "net"] }
tracing = { workspace = true }

[lints]
workspace = true
