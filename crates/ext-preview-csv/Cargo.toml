[package]
name = "ext-preview-csv"
version.workspace = true
description = "Rick preview plugin for CSV and TSV: delimiter sniffing, a header row and a virtualised grid over an indexed window of the file."
edition.workspace = true
license.workspace = true
repository.workspace = true

# A plugin: the `cdylib` the host loads from `plugins/preview-csv/`, and an
# `rlib` for the binary's opt-in `preview-csv` feature and the tests.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
types = { workspace = true }
ext = { workspace = true }
csv = { workspace = true }
encoding_rs = { workspace = true }
memchr = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
runtime = { workspace = true }
vfs-local = { workspace = true }
platform = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
