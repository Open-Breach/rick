[package]
name = "ext-git"
version.workspace = true
description = "Rick's Git extension: status badges, branch and ahead/behind as a Decorator through gix, the Git action group, and an info panel section."
edition.workspace = true
license.workspace = true
repository.workspace = true

# The reference plugin: a `cdylib` the host loads from `plugins/git/`, and
# an `rlib` for the binary's opt-in `git` feature and the tests.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
types = { workspace = true }
ext = { workspace = true }
gix = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
runtime = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
vfs-local = { workspace = true }
platform = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
