[package]
name = "ext-installer"
version.workspace = true
description = "Rick's tarball installer: Install as application on a tar or zip archive, a versioned layout under ~/.local/opt with a current symlink, desktop entry, icon and commands on the PATH, update with one previous version kept, revert, uninstall, repair and the Installed Apps view; Linux only, as a plugin."
edition.workspace = true
license.workspace = true
repository.workspace = true

# A plugin: a `cdylib` the host loads from `plugins/installer/`, and an
# `rlib` for the binary's opt-in `installer` feature and the tests.
[lib]
crate-type = ["cdylib", "rlib"]

# `fixtures` adds the generated test archives (`fixtures` module) the
# crate's own tests and the acceptance tests in `tests` install from; the
# shipped plugin is built without it.
[features]
default = []
fixtures = []

[dependencies]
types = { workspace = true }
ext = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true, features = ["fs"] }
tracing = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
# The archive is read by this crate itself, so the plugin does not depend
# on the archive provider (specs/ext-installer.md "Plugin architecture").
zip = { workspace = true }
tar = { workspace = true }
flate2 = { workspace = true }
liblzma = { workspace = true }
bzip2 = { workspace = true }
zstd = { workspace = true }

[dev-dependencies]
ext-installer = { path = ".", features = ["fixtures"] }
runtime = { workspace = true }
platform = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
