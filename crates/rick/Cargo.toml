[package]
name = "rick"
version.workspace = true
description = "Rick, a god-like file manager: the binary that wires the kernel, the built-in extensions and the egui user interface."
edition.workspace = true
license.workspace = true
repository.workspace = true

build = "build.rs"

# The command line and the single instance as a library (`cli`,
# `instance`), so the binary's integration tests drive them against the
# built binary.
[lib]
name = "rick"
path = "src/lib.rs"

[[bin]]
name = "rick"
path = "src/main.rs"

# The ZFS plugin's privileged helper (`ext_zfs::helper`), beside `rick`
# like `rick-perms`.
[[bin]]
name = "rick-zfs"
path = "src/bin/rick-zfs.rs"

# Built-in extensions are features, default-on; a lean build turns them off.
# `git`, `svn`, `vfs-trash`, `vfs-archive`, `ssh`, the three cloud
# providers, `preview-hex` and the five `search-*` connectors compile a
# plugin in instead of loading it from `plugins/`; default off, since the
# plugins directory is where they live in 0.2. The previewer plugins of
# issue 18, the 3D previewer of issue 19, the markup previewer of issue
# 51, the four action plugins of issue 23, the installer of issue 44 and
# the icon previewer of issue 84 have the same opt-in features;
# `gstreamer` turns playback on in the media previewer, wherever it is
# built (the plugin's own feature of that name; off by default so a build
# without the GStreamer development files still builds every crate).
[features]
default = ["preview-text", "preview-code", "preview-image", "preview-pdf"]
preview-text = ["dep:ext-preview-text"]
preview-code = ["dep:ext-preview-code"]
preview-image = ["dep:ext-preview-image"]
preview-pdf = ["dep:ext-preview-pdf"]
preview-hex = ["dep:ext-preview-hex"]
preview-office = ["dep:ext-preview-office"]
preview-media = ["dep:ext-preview-media"]
preview-archive = ["dep:ext-preview-archive"]
preview-markup = ["dep:ext-preview-markup"]
preview-3d = ["dep:ext-preview-3d"]
preview-icons = ["dep:ext-preview-icons"]
gstreamer = ["preview-media", "ext-preview-media/gstreamer"]
git = ["dep:ext-git"]
svn = ["dep:ext-svn"]
# `zfs` compiles the ZFS plugin in; the crate itself is always a
# dependency, because the privileged helper `rick-zfs` is built from it.
zfs = []
vfs-trash = ["dep:ext-vfs-trash"]
vfs-archive = ["dep:ext-vfs-archive"]
search-walk = ["dep:ext-search-walk"]
search-windows = ["dep:ext-search-windows"]
search-spotlight = ["dep:ext-search-spotlight"]
search-tracker = ["dep:ext-search-tracker"]
search-baloo = ["dep:ext-search-baloo"]
ssh = ["dep:ext-ssh"]
vfs-s3 = ["dep:ext-vfs-s3"]
vfs-azure = ["dep:ext-vfs-azure"]
vfs-gcs = ["dep:ext-vfs-gcs"]
action-compress = ["dep:ext-action-compress"]
action-compare = ["dep:ext-action-compare"]
action-terminal = ["dep:ext-action-terminal"]
action-rename = ["dep:ext-action-rename"]
installer = ["dep:ext-installer"]

[dependencies]
types = { workspace = true }
platform = { workspace = true }
ext = { workspace = true }
vfs-local = { workspace = true }
model = { workspace = true }
app = { workspace = true }
ui-egui = { workspace = true }
plugins-native = { workspace = true }
ext-preview-text = { workspace = true, optional = true }
ext-preview-code = { workspace = true, optional = true }
ext-preview-image = { workspace = true, optional = true }
ext-preview-pdf = { workspace = true, optional = true }
ext-preview-hex = { workspace = true, optional = true }
ext-git = { workspace = true, optional = true }
ext-vfs-trash = { workspace = true, optional = true }
ext-vfs-archive = { workspace = true, optional = true }
ext-ssh = { workspace = true, optional = true }
ext-vfs-s3 = { workspace = true, optional = true }
ext-vfs-azure = { workspace = true, optional = true }
ext-vfs-gcs = { workspace = true, optional = true }
ext-action-compress = { workspace = true, optional = true }
ext-action-compare = { workspace = true, optional = true }
ext-action-terminal = { workspace = true, optional = true }
ext-action-rename = { workspace = true, optional = true }
ext-installer = { workspace = true, optional = true }
ext-preview-office = { workspace = true, optional = true }
ext-preview-media = { workspace = true, optional = true }
ext-preview-archive = { workspace = true, optional = true }
ext-preview-markup = { workspace = true, optional = true }
ext-svn = { workspace = true, optional = true }
ext-zfs = { workspace = true }
ext-search-walk = { workspace = true, optional = true }
ext-search-windows = { workspace = true, optional = true }
ext-search-spotlight = { workspace = true, optional = true }
ext-search-tracker = { workspace = true, optional = true }
ext-search-baloo = { workspace = true, optional = true }
ext-preview-3d = { workspace = true, optional = true }
ext-preview-icons = { workspace = true, optional = true }
runtime = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
# The single-instance endpoint's serving loop (`instance`): the timers and
# the task handle, on the one runtime.
tokio = { workspace = true, features = ["time", "rt", "sync"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[build-dependencies]
# The icon and version resource of `rick.exe` (specs/app-icons.md), compiled
# by build.rs for Windows targets only; the crate builds everywhere, so the
# script needs no `cfg` of its own. Without its `toml` feature: the fields
# are set in the script, not read from this manifest.
winresource = { version = "0.1", default-features = false }

[dev-dependencies]
# The tests of `rick-perms`, the privileged helper: run through the fake
# platform, and as root through the polkit stand-in of Linux CI.
ops = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
