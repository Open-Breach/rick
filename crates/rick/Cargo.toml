[package]
name = "rick"
version.workspace = true
description = "Rick, a god-like file manager: the binary that wires the kernel, the built-in extensions and the egui user interface."
edition.workspace = true
license.workspace = true
repository.workspace = true

build = "build.rs"

[[bin]]
name = "rick"
path = "src/main.rs"

# Built-in extensions are features, default-on; a lean build turns them off.
# `git`, `vfs-trash` and `vfs-archive` compile a plugin in instead of
# loading it from `plugins/`; default off, since the plugins directory is
# where they live in 0.2.
[features]
default = ["preview-text", "preview-code", "preview-image", "preview-pdf"]
preview-text = ["dep:ext-preview-text"]
preview-code = ["dep:ext-preview-code"]
preview-image = ["dep:ext-preview-image"]
preview-pdf = ["dep:ext-preview-pdf"]
git = ["dep:ext-git"]
vfs-trash = ["dep:ext-vfs-trash"]
vfs-archive = ["dep:ext-vfs-archive"]

[dependencies]
types = { workspace = true }
platform = { workspace = true }
ext = { workspace = true }
vfs-local = { workspace = true }
app = { workspace = true }
ui-egui = { workspace = true }
plugins-native = { workspace = true }
ext-preview-text = { workspace = true, optional = true }
ext-preview-code = { workspace = true, optional = true }
ext-preview-image = { workspace = true, optional = true }
ext-preview-pdf = { workspace = true, optional = true }
ext-git = { workspace = true, optional = true }
ext-vfs-trash = { workspace = true, optional = true }
ext-vfs-archive = { workspace = true, optional = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
