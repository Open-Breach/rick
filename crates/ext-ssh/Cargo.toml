[package]
name = "ext-ssh"
version.workspace = true
description = "Rick's SSH plugin: remote hosts browsed through shell commands over SSH exec channels, the hosts of ~/.ssh/config and Rick's own in the Network section, and the console actions."
edition.workspace = true
license.workspace = true
repository.workspace = true

# A plugin: a `cdylib` the host loads from `plugins/ssh/`, and an `rlib`
# for the binary's opt-in `ssh` feature and the tests.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
types = { workspace = true }
ext = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true, features = ["io-util", "sync", "net", "time", "macros"] }
tracing = { workspace = true }
russh = { workspace = true }
bytes = { workspace = true }
toml = { workspace = true }
# The hashed host names of `known_hosts`: HMAC-SHA1 over the name with the
# entry's salt, both base64.
hmac = { workspace = true }
sha1 = { workspace = true }
base64 = { workspace = true }

[dev-dependencies]
runtime = { workspace = true }
platform = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["process", "rt", "macros"] }

[features]
# The SSH server in the test process (`fake_sshd`), for the `tests` crate's
# acceptance tests; the plugin's own tests build it under `cfg(test)`.
fake-sshd = ["tokio/process", "tokio/rt"]

[lints]
workspace = true
