# cargo-about: the third-party license list shipped in every release archive
# as THIRD-PARTY-LICENSES.md (`cargo about generate about.hbs`). The accepted
# licenses are deny.toml's allow list; the targets are the release matrix.
accepted = [
    "Apache-2.0", "BSL-1.0", "MIT", "BSD-2-Clause", "BSD-3-Clause", "CC0-1.0", "ISC",
    "Unicode-3.0", "Zlib", "OFL-1.1", "Ubuntu-font-1.0", "bzip2-1.0.6",
]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# The workspace's own crates are Apache-2.0 and not third party.
private = { ignore = true }
