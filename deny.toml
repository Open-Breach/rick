[licenses]
allow = ["Apache-2.0", "MIT", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib"]

[bans]
multiple-versions = "warn"
# Layer order (SPEC.md "Package layout"): types → runtime → platform → vfs →
# vfs-local → model → ops → ext → app → ui-egui → rick, with `tests` on top.
# Each workspace crate below lists in `wrappers` the crates that may depend on
# it; a crate missing from the list is an upward edge and fails the check.
# `types` may be used by everyone and needs no entry. Add an entry per crate as
# crates appear, e.g. { crate = "ui-egui", wrappers = ["rick", "tests"] }.
deny = [
    { crate = "runtime", wrappers = ["tests"] },
]
