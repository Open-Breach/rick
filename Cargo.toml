[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0-dev"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Open-Breach/rick"

[workspace.dependencies]
# Kernel crates.
types = { path = "crates/types" }
runtime = { path = "crates/runtime" }
platform = { path = "crates/platform" }
ext = { path = "crates/ext" }
vfs = { path = "crates/vfs" }
vfs-local = { path = "crates/vfs-local" }
vfs-rick = { path = "crates/vfs-rick" }
model = { path = "crates/model" }
ops = { path = "crates/ops" }
app = { path = "crates/app" }
ui-egui = { path = "crates/ui-egui" }
ext-preview-text = { path = "crates/ext-preview-text" }
ext-preview-code = { path = "crates/ext-preview-code" }
ext-preview-image = { path = "crates/ext-preview-image" }
ext-preview-pdf = { path = "crates/ext-preview-pdf" }
ext-preview-hex = { path = "crates/ext-preview-hex" }
ext-git = { path = "crates/ext-git" }
ext-vfs-trash = { path = "crates/ext-vfs-trash" }
ext-vfs-archive = { path = "crates/ext-vfs-archive" }
ext-preview-office = { path = "crates/ext-preview-office" }
ext-preview-media = { path = "crates/ext-preview-media" }
ext-preview-archive = { path = "crates/ext-preview-archive" }
ext-preview-csv = { path = "crates/ext-preview-csv" }
plugins-native = { path = "crates/plugins-native" }
plugin-probe = { path = "crates/plugin-probe" }
plugin-panic = { path = "crates/plugin-panic" }

# Third-party.
gix = { version = "0.90", default-features = false, features = ["status", "revision", "parallel", "sha1"] }
encoding_rs = "0.8"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
jpeg-decoder = { version = "0.3", default-features = false }
kamadak-exif = "0.6"
pdfium-render = { version = "0.9", default-features = false, features = ["pdfium_latest", "thread_safe"] }
# Bundled grammars and themes with the pure-Rust regex engine; no YAML or
# plist loading at run time.
syntect = { version = "5", default-features = false, features = ["parsing", "default-syntaxes", "default-themes", "regex-fancy"] }
# Archives (SPEC.md "Archives and compression"): zip through `zip` with
# DEFLATE from flate2's Rust backend and zstd; the tar family through `tar`
# and the codec crates; 7z through the pure-Rust `sevenz-rust2`; RAR through
# the bundled unrar library (read-only); ISO 9660 and UDF images through
# the hadris readers; brotli and snappy for the single-file codecs. The
# archive previewer (issue 18) lists through the same crates and reads the
# xz headers of a compressed tar through `lzma-rust2`.
zip = { version = "9", default-features = false, features = ["deflate-flate2", "zstd"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = "0.4"
zstd = { version = "0.14", default-features = false }
liblzma = { version = "0.4", default-features = false, features = ["static"] }
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "xz"] }
bzip2 = "0.6"
lz4_flex = { version = "0.14", default-features = false, features = ["std", "frame", "safe-encode", "safe-decode"] }
brotli = { version = "9", default-features = false, features = ["std"] }
snap = "1"
sevenz-rust2 = { version = "0.25", default-features = false, features = ["compress", "util", "bzip2", "deflate", "zstd", "ppmd"] }
unrar = "0.5"
hadris-fs = { version = "3.0.0-rc.3", default-features = false, features = ["std", "sync"] }
hadris-iso = { version = "3.0.0-rc.3", default-features = false, features = ["std", "sync"] }
hadris-udf = { version = "3.0.0-rc.3", default-features = false, features = ["std", "sync"] }
hadris-storage = { version = "3.0.0-rc.3", default-features = false, features = ["std", "sync"] }
# The other previewer plugins of issue 18: Office metadata from the zip's
# XML, CSV, Markdown and HTML, media tags and GStreamer playback.
roxmltree = "0.21"
csv = "1"
memchr = "2"
pulldown-cmark = { version = "0.13", default-features = false }
html-escape = "0.3"
id3 = { version = "1", default-features = false }
gstreamer = "0.25"
gstreamer-app = "0.25"
gstreamer-audio = "0.25"
gstreamer-video = "0.25"
gstreamer-pbutils = "0.25"
# Select by pattern (glob and regular expression) in the core actions,
# bulk rename's find and replace; the text diff of `ext-action-compare`;
# the console of `ext-action-terminal` (a pseudo-terminal and the parser
# of its escape sequences).
globset = "0.4"
regex = "1"
similar = "2"
portable-pty = "0.9"
vte = "0.15"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
eframe = "0.36"
egui = "0.36"
egui_dock = "0.21"
egui_extras = { version = "0.36", default-features = false }
egui_kittest = { version = "0.36", features = ["eframe"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
arboard = { version = "3", default-features = false }
async-trait = "0.1"
bitflags = "2"
futures = "0.3"
libc = "0.2"
libloading = "0.8"
notify = "8"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false }
rayon = "1"
rfd = { version = "0.16", default-features = false }
rustix = { version = "1", default-features = false }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
smallvec = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", default-features = false }
toml = "0.9"
tracing = "0.1"
windows = "0.62"
# NTFS directory junctions for Create link / Paste as link on Windows.
junction = "2"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

[workspace.lints.rust]
unsafe_code = "warn"
