# Words clippy's `doc_markdown` would otherwise want in backticks: product
# names the previewers' documentation uses as words, and the binary units
# the size strings use. The `..` keeps clippy's own list (macOS, OpenGL, …).
doc-valid-idents = ["GStreamer", "LibreOffice", "WebP", "OpenDocument", "KiB", "MiB", "GiB", ".."]
